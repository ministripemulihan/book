<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layar 2 — Tampilan Presentasi</title>
<style>
  :root {
    --p-bg: #05070c;
    --p-ink: #f5f2e8;
    --p-accent: #d8b45c;
    --p-font: "Literata", Georgia, serif;
    --p-scale: 1;
    --p-koor: #ffd84a;
    --p-line-height: 1.35;
    /* BARU (28 Agu 2026) -- "Ukuran Konten" (tab Tampilan): mengalikan
       lebar maksimum kotak teks (#text) & jarak tepi kotak (#stage
       padding) -- 1 = bawaan lama (tidak berubah), <1 mempersempit
       (lebih banyak ruang latar terlihat di tepi, cocok dipakai
       bersama 🎥 Kamera/Gambar Latar), >1 melebarkan (teks memakai
       hampir seluruh lebar layar). Lihat applyTheme() -> contentScale. */
    --p-content-scale: 1;
    /* BARU (4 Sep 2026) -- toggle "Tebal" (Bold) untuk tulisan Layar 2,
       lihat applyTheme() di skrip bawah & checkbox #psFontBold di Studio
       (js/presentation-studio.js). 400 = bawaan lama (tidak berubah sama
       sekali kalau operator tidak pernah menyentuh toggle ini). */
    --p-font-weight: 400;
    /* BARU (6 Sep 2026, permintaan operator) -- "Ukuran Timer/Stopwatch",
       TERPISAH dari --p-scale di atas (yang untuk ayat/teks/kidung) --
       lihat catatan panjang di DEFAULT_STAGE_THEME.timerScale
       (js/presentation-studio.js) & slider "Ukuran Timer/Stopwatch"
       (index.html) untuk alasan kenapa dipisah. 1 = bawaan lama (tidak
       berubah), dipakai #timerRing & #stopwatchTime di bawah. */
    --p-timer-scale: 1;
    /* BARU (7 Sep 2026, permintaan operator) -- lihat catatan panjang di
       fitTimerClockNumber_() di skrip bawah: faktor koreksi OTOMATIS
       (dihitung dari lebar layar sungguhan, BUKAN diatur manual) supaya
       angka 🎯 Jam Target (#timerClockTime) tidak pernah tumpah keluar
       kotak tengahnya sendiri -- itulah sebabnya sebelumnya terasa
       "tidak persis di tengah" kalau --p-timer-scale/--p-scale dibesarkan
       sampai teksnya lebih lebar dari layar: teks tumpah ke kanan
       (karena tidak bisa dipenggal, angka jam tidak ada spasi), padahal
       kotaknya sendiri sebetulnya sudah center lewat left:50%+translate.
       1 = tidak mengecilkan sama sekali (nilai bawaan sebelum dihitung). */
    --p-timerclock-fit: 1;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--p-bg);
    color: var(--p-ink);
    font-family: var(--p-font);
    overflow: hidden;
  }
  /* Vignette halus di tepi layar -- bikin layar proyektor terasa lebih
     "dirancang" (broadcast-style) daripada sekadar warna polos rata. */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.28) 100%);
  }
  /* BARU (28 Agu 2026) -- 🎥 Kamera Latar: video kamera hidup ditaruh
     SEBAGAI ANAK <body> paling awal, position:fixed z-index:0 -- di
     BAWAH #stage (z-index:2) & vignette di atas (z-index:1), tapi di
     ATAS latar polos body (--p-bg), yang secara CSS selalu dilukis
     paling dasar duluan apa pun z-index anak-anaknya -- jadi video ini
     otomatis "mengintip" di balik ayat/kidung/pengumuman TANPA perlu
     mengosongkan/mengubah background body sama sekali. Disembunyikan
     total (atribut `hidden`) selama kamera belum diaktifkan operator --
     TIDAK memuat/meminta izin kamera sama sekali sebelum itu (lihat
     startCamera() di skrip bawah, dipanggil HANYA saat pesan "camera"
     dengan on:true diterima dari Studio). */
  #camBg, #imgBg {
    position: fixed; inset: 0; z-index: 0;
    width: 100vw; height: 100vh; object-fit: cover;
    background: #000;
    transition: opacity .35s ease, height .3s ease, top .3s ease;
  }
  /* BARU (8 Sep 2026, permintaan operator) -- Tata Letak "Kamera di
     Atas, Teks di Bawah": SEBELUMNYA Kamera/Gambar Latar SELALU
     memenuhi layar penuh (#camBg/#imgBg inset:0) dengan ayat/kidung/
     pengumuman DITIMPAKAN di tengah-tengahnya (dibaca lewat warna+
     stroke kontras di panel "🎨 Warna, Stroke & Ukuran Huruf"). Mode
     "split" ini (toggle "📐 Kamera Atas, Teks Bawah" di tab 🎥 Kamera,
     Studio) TIDAK menimpa -- kamera/gambar dipepetkan ke ATAS layar
     saja, sisanya di BAWAH jadi milik #stage sepenuhnya (latar solid
     warna tema --p-bg, BUKAN transparan) supaya ayat/kidung/pengumuman
     selalu terbaca jelas TANPA perlu bergantung pada stroke/kontur.
     BARU (8 Sep 2026 v2, permintaan operator) -- tinggi zona kamera
     SEKARANG bisa diatur BEBAS lewat slider "Ukuran Zona Kamera" di
     Studio (10%-90%, bawaan 42%) -- nilainya dikirim sebagai
     `--p-cam-split-pct` (lihat theme.camSplitPct, applyTheme() di
     bawah & wireTheme()/js/presentation-studio.js), BUKAN lagi angka
     42% tetap. Dipicu lewat class "cam-split" di <body> (bagian dari
     `theme.camLayout`, lihat catatan panjang mode "cam-subtitle" di
     bawah untuk pilihan tata letak KE-2 yang BARU juga ditambahkan). */
  body.cam-split #camBg, body.cam-split #imgBg {
    height: var(--p-cam-split-pct, 42%);
    top: 0; bottom: auto;
  }
  body.cam-split #stage {
    position: fixed; left: 0; right: 0; bottom: 0;
    top: var(--p-cam-split-pct, 42%);
    height: auto;
    background: var(--p-bg);
    justify-content: center;
  }
  /* BARU (8 Sep 2026 v4, permintaan operator "latar belakang transparan
     atau ada backgroundnya") -- kalau operator mencentang "Latar zona
     teks transparan" di Studio (theme.stageTransparent, lihat
     applyTheme() bawah), zona teks mode "Kamera Atas, Teks Bawah" ini
     TIDAK lagi solid --p-bg, tapi tembus pandang -- kamera/gambar tetap
     kelihatan samar di baliknya. Dipicu lewat class "stage-transparent"
     di <body>, HANYA berpengaruh saat digabung dengan "cam-split" (di
     mode lain tidak relevan: "full" teks memang sudah menimpa langsung,
     "subtitle" sudah pakai gradasi transparan sendiri, "bubble" tidak
     punya zona teks solid terpisah). */
  body.cam-split.stage-transparent #stage { background: transparent; }
  /* BARU (9 Sep 2026, sesi ke-9, permintaan operator "teks atas kamera
     bawah, dan seterusnya") -- BALIK ATAS-BAWAH untuk mode "split" (yang
     bawaannya kamera-atas/teks-bawah): kalau dicentang "🔁 Balik Atas-
     Bawah" di Studio, kamera pindah ke BAWAH, zona teks (#stage) pindah
     ke ATAS. Pola classnya SENGAJA disamakan dengan "cam-split-lr-
     reverse" yang sudah ada (kombinasi class, bukan mode baru terpisah)
     supaya tidak perlu slider/opsi camLayout baru -- cukup 1 checkbox
     tambahan yang HANYA berlaku saat camLayout === "split". Dipicu lewat
     class "cam-split-reverse-tb" (theme.camSplitReverseTB), lihat
     applyTheme() di bawah. */
  body.cam-split.cam-split-reverse-tb #camBg,
  body.cam-split.cam-split-reverse-tb #imgBg {
    top: auto; bottom: 0;
  }
  body.cam-split.cam-split-reverse-tb #stage {
    top: 0; bottom: auto;
  }
  body.video-overlay.cam-split.cam-split-reverse-tb #ytView,
  body.video-overlay.cam-split.cam-split-reverse-tb #localVideoEl {
    top: auto; bottom: 0;
  }
  /* BARU (9 Sep 2026, sesi ke-9, permintaan operator "1 layar dibagi 2, kiri kamera
     kanan berita") -- Tata Letak KE-4 (BARU): "◧ Kamera Kiri, Konten
     Kanan" (kiri-kanan, BEDA dari "split" di atas yang atas-bawah).
     Dipicu lewat class "cam-split-lr" di <body> (theme.camLayout ===
     "split-lr"). Numpang slider "Ukuran Zona Kamera" yang SAMA
     (--p-cam-split-pct) supaya operator tidak perlu slider baru --
     di sini persentase itu dibaca sebagai LEBAR (bukan tinggi). Kalau
     operator ingin sisi kamera di KANAN bukan kiri, cukup tambah
     centang "Balik Sisi" (class "cam-split-lr-reverse", lihat
     applyTheme() bawah & theme.camSplitReverse). */
  body.cam-split-lr #camBg, body.cam-split-lr #imgBg {
    width: var(--p-cam-split-pct, 42%); height: 100vh;
    top: 0; left: 0; right: auto; bottom: auto;
  }
  body.cam-split-lr #stage {
    position: fixed; top: 0; bottom: 0; right: 0;
    left: var(--p-cam-split-pct, 42%);
    width: auto; height: auto;
    background: var(--p-bg);
    justify-content: center;
  }
  body.cam-split-lr.stage-transparent #stage { background: transparent; }
  /* Balik sisi: kamera pindah ke KANAN, konten (#stage) ke KIRI. */
  body.cam-split-lr.cam-split-lr-reverse #camBg,
  body.cam-split-lr.cam-split-lr-reverse #imgBg {
    left: auto; right: 0;
  }
  body.cam-split-lr.cam-split-lr-reverse #stage {
    left: 0; right: var(--p-cam-split-pct, 42%);
  }
  body.video-overlay.cam-split-lr #ytView,
  body.video-overlay.cam-split-lr #localVideoEl {
    width: var(--p-cam-split-pct, 42%) !important; height: 100vh !important;
    top: 0; left: 0; right: auto; bottom: auto; object-fit: cover;
  }
  body.video-overlay.cam-split-lr.cam-split-lr-reverse #ytView,
  body.video-overlay.cam-split-lr.cam-split-lr-reverse #localVideoEl {
    left: auto; right: 0;
  }
  /* Vignette (body::before) & dim (.cam-active::after) di atas tetap
     menutupi seluruh layar di mode split -- tidak masalah, opacitynya
     sangat tipis dan tetap enak dilihat di kedua zona. */
  /* BARU (8 Sep 2026 v2, permintaan operator "seperti nonton video ada
     subtitlenya") -- Tata Letak KE-2 (BARU): "🎬 Latar Penuh + Subtitle".
     BEDA dari mode "split" di atas (yang MEMOTONG layar jadi 2 zona
     terpisah, kamera cuma keliatan di zona atas) -- mode ini kamera/
     gambar MEMENUHI SELURUH LAYAR seperti nonton video biasa, dan
     ayat/kidung/pengumuman muncul sebagai BAR SUBTITLE menempel di
     BAWAH (gradasi gelap tipis di belakangnya, BUKAN blok solid penuh)
     -- persis gaya caption/subtitle film/video pada umumnya, video di
     baliknya tetap terlihat penuh sampai ke pinggir atas. Dipicu lewat
     class "cam-subtitle" di <body> (theme.camLayout === "subtitle"). */
  body.cam-subtitle #camBg, body.cam-subtitle #imgBg {
    height: 100vh; top: 0; bottom: auto;
  }
  body.cam-subtitle #stage {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    height: auto; max-height: 46%;
    justify-content: flex-end;
    /* Gradasi gelap dari bawah (hampir solid) ke atas (transparan penuh)
       -- teks selalu kontras tanpa menutupi video secara solid. */
    background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.58) 55%, rgba(0,0,0,0) 100%);
    padding-top: 10vh;
  }
  /* BARU (9 Sep 2026, sesi ke-9, permintaan operator "kamera penuh + teks
     melayang di atas") -- Subtitle DI ATAS, kebalikan bar bawaan mode
     "subtitle" (yang menempel bawah). Dipicu lewat class kombinasi
     "cam-subtitle-top" (theme.camSubtitleTop), HANYA berlaku bareng
     "cam-subtitle" -- gradasi & posisi bar dibalik total (flex-start,
     gradasi gelap dari ATAS memudar ke bawah). */
  body.cam-subtitle.cam-subtitle-top #stage {
    top: 0; bottom: auto;
    justify-content: flex-start;
    background: linear-gradient(to bottom, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.58) 55%, rgba(0,0,0,0) 100%);
    padding-top: 0; padding-bottom: 10vh;
  }
  /* BARU (8 Sep 2026 v3, permintaan operator "dibalik, teks semua ayat,
     kamera bulat kanan-bawah") -- Tata Letak KE-3 (BARU): "🔵 Teks
     Penuh, Kamera Bulat". KEBALIKAN dari mode "split"/"subtitle" di atas
     (yang keduanya bikin kamera/gambar jadi UNSUR UTAMA layar) -- di
     sini AYAT/KIDUNG/PENGUMUMAN yang jadi utama, tampil PERSIS seperti
     kalau Kamera/Gambar Latar TIDAK aktif sama sekali (latar solid warna
     tema, #stage tidak diubah ukuran/posisinya) -- Kamera/Gambar Latar
     cuma jadi lingkaran KECIL mengambang di pojok kanan-bawah (gaya
     "self-view" webcam ala Zoom/Google Meet), z-index SENGAJA lebih
     tinggi dari #stage (2) supaya lingkarannya tidak pernah tertutup
     teks. Ukurannya diatur slider "Ukuran lingkaran Kamera" (120px-
     420px, bawaan 200px) -- lihat theme.camBubbleSize & --p-cam-bubble-
     size di applyTheme() bawah/js/presentation-studio.js. */
  /* BARU (9 Sep 2026, sesi ke-9, permintaan operator "lingkaran kecil di
     5 sisi, dari kecil sampai besar sekali") -- posisi bubble SEKARANG
     bisa dipilih (dulu terkunci pojok kanan-bawah), dipicu lewat 1 dari
     5 class kombinasi "bubble-pos-*" di <body> (theme.bubblePos, lihat
     applyTheme() bawah). TIDAK ada class = bawaan lama (kanan-bawah,
     backward-compatible kalau ada tema lama tersimpan tanpa field ini).
     Dipakai BERSAMA "cam-bubble" (kamera bulat) MAUPUN "cam-textbubble"
     (BARU di bawah -- teks yang bulat) -- 1 set posisi untuk keduanya. */
  body.bubble-pos-tl #camBg, body.bubble-pos-tl #imgBg,
  body.bubble-pos-tl #stage.stage-bubble-el {
    top: 28px; left: 28px; right: auto; bottom: auto;
  }
  body.bubble-pos-tr #camBg, body.bubble-pos-tr #imgBg,
  body.bubble-pos-tr #stage.stage-bubble-el {
    top: 28px; right: 28px; left: auto; bottom: auto;
  }
  body.bubble-pos-bl #camBg, body.bubble-pos-bl #imgBg,
  body.bubble-pos-bl #stage.stage-bubble-el {
    bottom: 28px; left: 28px; right: auto; top: auto;
  }
  body.bubble-pos-br #camBg, body.bubble-pos-br #imgBg,
  body.bubble-pos-br #stage.stage-bubble-el {
    bottom: 28px; right: 28px; left: auto; top: auto;
  }
  body.bubble-pos-c #camBg, body.bubble-pos-c #imgBg,
  body.bubble-pos-c #stage.stage-bubble-el {
    top: 50%; left: 50%; right: auto; bottom: auto;
    transform: translate(-50%, -50%);
  }
  body.cam-bubble #camBg, body.cam-bubble #imgBg {
    width: var(--p-cam-bubble-size, 200px); height: var(--p-cam-bubble-size, 200px);
    top: auto; left: auto; right: 28px; bottom: 28px; /* bawaan kanan-bawah, ditimpa bubble-pos-* di atas kalau operator pilih posisi lain */
    border-radius: 50%; object-fit: cover;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    border: 3px solid rgba(255,255,255,0.85);
    z-index: 5;
    transition: opacity .35s ease, width .3s ease, height .3s ease, top .3s ease, left .3s ease, right .3s ease, bottom .3s ease;
  }
  body.cam-bubble #stage { background: var(--p-bg); }
  /* BARU (9 Sep 2026, sesi ke-9, permintaan operator "teks dalam bentuk
     lingkaran kecil ... + kamera di belakang") -- KEBALIKAN dari
     "cam-bubble" di atas: di sini KAMERA/GAMBAR yang memenuhi SELURUH
     LAYAR sebagai latar (persis seperti mode "full" tanpa split), dan
     AYAT/KIDUNG/PENGUMUMAN (#stage) yang jadi lingkaran KECIL mengambang
     -- gaya kebalikan dari webcam bubble ala Zoom (di sini "teks" yang
     jadi jendela kecilnya). Dipicu lewat class "cam-textbubble"
     (theme.camLayout === "textbubble"). Ukuran diatur slider terpisah
     "Ukuran Lingkaran Teks" (--p-textbubble-size, 200px-1200px, bawaan
     420px) -- terpisah dari --p-cam-bubble-size supaya operator bisa
     pindah dari mode kamera-bulat ke teks-bulat tanpa ukurannya ikut
     berubah tak terduga. Class "stage-bubble-el" HARUS ditambahkan ke
     #stage lewat JS (lihat applyTheme() bawah) supaya selector posisi
     "bubble-pos-*" di atas (yang generik untuk #camBg/#imgBg/#stage)
     tidak sengaja mengubah #stage di mode LAIN yang tidak memintanya. */
  body.cam-textbubble #camBg, body.cam-textbubble #imgBg {
    width: 100vw; height: 100vh; top: 0; left: 0; right: auto; bottom: auto;
    border-radius: 0; border: none; box-shadow: none;
  }
  body.cam-textbubble #stage.stage-bubble-el {
    position: fixed; height: auto;
    width: var(--p-textbubble-size, 420px); min-height: var(--p-textbubble-size, 420px);
    right: 28px; bottom: 28px; /* bawaan kanan-bawah, ditimpa bubble-pos-* di atas */
    border-radius: 50%; overflow: auto;
    background: var(--p-bg);
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    border: 3px solid rgba(255,255,255,0.85);
    padding: 6vh 5vh; /* padding lebih kecil dari #stage biasa (6vw) supaya teks tidak mepet tepi lingkaran */
    z-index: 5;
    transition: opacity .35s ease, width .3s ease, height .3s ease, top .3s ease, left .3s ease, right .3s ease, bottom .3s ease;
  }
  body.cam-textbubble.cam-active::after { display: none; } /* sama alasan seperti cam-bubble -- tidak perlu dim seisi layar */
  /* Dim tipis (body.cam-active::after, lihat di bawah) hanya berguna
     saat teks DITIMPAKAN LANGSUNG di atas kamera/gambar (mode "full") --
     di mode bubble teks berdiri di latar solid biasa, jadi dim itu
     dimatikan supaya tidak menggelapkan seisi layar tanpa alasan. */
  body.cam-bubble.cam-active::after { display: none; }
  /* BARU (8 Sep 2026, permintaan operator "video ada subtitle-nya") --
     Video YouTube (#ytView) & Video Lokal (#localVideoEl) mengikuti
     UKURAN/POSISI Tata Letak yang SAMA seperti Kamera/Gambar Latar di
     atas (split/subtitle) KETIKA operator menyalakan toggle "📝
     Ayat/Kidung/Pengumuman TETAP tampil di atas video" (class
     "video-overlay" di <body>, lihat theme.videoTextOverlay &
     applyTheme() bawah) -- video jadi berperan sebagai "latar" persis
     seperti kamera/gambar, dan #text/#ref TIDAK lagi dikosongkan saat
     video diputar (lihat showMain() kind "youtube" & showLocalVideo()
     di skrip bawah). Mode "bubble" SENGAJA tidak berlaku untuk video
     (tidak ada lingkaran kamera pada video) -- video di mode itu jatuh
     ke tampilan "full" biasa. */
  body.video-overlay.cam-split #ytView,
  body.video-overlay.cam-split #localVideoEl {
    height: var(--p-cam-split-pct, 42%) !important; width: 100vw; top: 0; bottom: auto; object-fit: cover;
  }
  body.video-overlay.cam-subtitle #ytView,
  body.video-overlay.cam-subtitle #localVideoEl {
    height: 100vh !important; width: 100vw; top: 0; bottom: auto;
  }
  /* CATATAN: #slideView (File/PDF, kind "slide") SENGAJA TIDAK ikut
     diresize lewat cam-split/cam-subtitle di atas -- elemen ini `position`
     BUKAN `fixed` (beda dari #ytView/#localVideoEl), ukurannya sudah
     otomatis pas di tengah lewat max-width/max-height (lihat #slideView
     di bawah), jadi tetap dibiarkan seperti biasa (mode "full") --
     ayat/kidung/pengumuman tetap muncul menimpa di tengahnya kalau
     video-overlay menyala, cukup lewat showMain() kind "slide" TIDAK
     mengosongkan #text lagi (lihat di bawah), tanpa perlu resize CSS. */
  /* BARU (28 Agu 2026) -- 🖼️ Latar Gambar: gambar latar yang diunggah
     operator (tab "🎥 Kamera" -> "Sumber Latar" -> "Gambar"), lapisan
     PERSIS SAMA seperti #camBg (di bawah #stage, di atas --p-bg polos)
     tapi <img> biasa, bukan video -- keduanya TIDAK PERNAH aktif
     bersamaan (Studio hanya mengirim satu sumber latar aktif dalam
     satu waktu lewat "latarMode", lihat applyLatarSource() di bawah). */
  /* Dim tipis merata di atas latar hidup/gambar (di BAWAH vignette
     tepi, di ATAS latar) supaya tulisan (bahkan tanpa memilih gaya
     Putih/Hitam Border sekalipun) tetap sedikit lebih kontras
     terhadap latar yang warna/kecerahannya bisa berubah-ubah kapan
     saja (mis. lampu ruangan berkedip, orang lewat di depan kamera).
     Kelas "cam-active" dipertahankan namanya (dipakai sejak fitur
     Kamera pertama dibuat) tapi sekarang dipicu oleh KAMERA ATAU
     GAMBAR latar, mana pun yang aktif -- lihat updateLatarDimClass(). */
  body.cam-active::after {
    content: "";
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: rgba(0,0,0,0.18);
  }
  /* BARU (9 Sep 2026, permintaan operator) -- 🗺️ Peta Interaktif:
     gambar peta penuh layar (object-fit:contain, tidak terpotong) +
     lapisan pin di atasnya. Operator klik "🎯 Fokus" per pin di Studio
     -> gambar di sini di-zoom & di-geser (CSS transform, animasi halus)
     supaya titik itu pas di TENGAH layar -- lihat focusMapPin() di
     skrip bawah untuk perhitungan translate/scale-nya (berbasis piksel
     nyata lewat getBoundingClientRect(), BUKAN persentase CSS murni,
     supaya tetap akurat di rasio layar apa pun). z-index SAMA dengan
     #stage (2) -- keduanya saling meniadakan (TIDAK pernah tampil
     berbarengan), lihat showMap()/stopMap(). */
  #mapView {
    display: none; position: fixed; inset: 0; z-index: 2;
    overflow: hidden; background: #000;
  }
  #mapView:not([hidden]) { display: block; animation: fadeInOnly .4s ease both; }
  /* PERBAIKAN (10 Sep 2026, permintaan operator: "posisi pin beda antara
     Studio dan Layar 2") -- #mapContent adalah pembungkus BARU yang
     ukurannya SENGAJA dihitung lewat JS (positionMapContent_(), lihat
     skrip bawah) supaya PERSIS SAMA dengan area gambar yang benar-benar
     terlihat (bukan seluruh layar). SEBELUMNYA #mapImg dipasang
     object-fit:contain langsung di kotak seluas layar penuh -- kalau
     rasio layar (mis. proyektor 4:3) beda dari rasio gambar peta,
     muncul "ruang kosong" (letterbox) di kiri-kanan/atas-bawah, tapi
     pin (xPct/yPct) tetap dihitung terhadap kotak SELURUH LAYAR itu,
     bukan terhadap gambar yang sebenarnya tampil -- makanya posisi pin
     meleset, padahal di Studio (yang gambarnya TIDAK di-object-fit,
     jadi tidak pernah ada letterbox) titik yang sama terlihat pas.
     SEKARANG #mapImg & #mapPinsLayer sama-sama anak dari #mapContent,
     dan #mapContent inilah yang diberi ukuran+posisi persis area
     gambar (bukan #mapImg lagi) -- jadi xPct/yPct pin, yang dihitung
     relatif ke #mapContent, otomatis pas di manapun rasio layarnya,
     TANPA perlu memaksa semua jadi 16:9. Transform zoom/pan (translate/
     scale) juga dipindah ke #mapContent supaya pin ikut bergerak
     bersama gambar saat "🎯 Fokus"/slider zoom dipakai (SEBELUMNYA
     transform cuma di #mapImg, #mapPinsLayer diam di tempat). */
  #mapContent {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    transition: transform 1s ease;
  }
  #mapImg {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    display: block;
  }
  #mapPinsLayer { position: absolute; inset: 0; pointer-events: none; }
  /* BARU (9 Sep 2026, permintaan operator) -- badge legenda kategori
     ("Kaki Dian: 12", "Pos Injil: 8") di pojok kanan-atas peta, TAMPIL
     KE PENONTON (bukan cuma panel Studio) -- lihat showMap()/
     renderMapLegend_() di skrip bawah & categoryCounts yang dikirim dari
     wireMapTab() (js/presentation-studio.js). */
  #mapLegend {
    position: absolute; top: 4vh; right: 4vh; z-index: 1;
    display: flex; flex-direction: column; gap: 0.6vh;
    background: rgba(0,0,0,.55); padding: 1.4vh 1.8vh; border-radius: 10px;
    backdrop-filter: blur(3px);
  }
  #mapLegend:empty { display: none; }
  /* BARU (9 Sep 2026, permintaan operator) -- 🌏 banner Total Penduduk
     Indonesia (Nasional), pojok kiri-atas (sisi kosong -- legenda
     kategori sudah pakai kanan-atas, kartu info kota pakai kiri-bawah).
     Independen dari transform zoom peta (sibling dari #mapImg, bukan di
     dalamnya) supaya TETAP kelihatan walau operator zoom/fokus ke 1
     kota -- lihat renderNationalPop_() & showMap() di skrip bawah. */
  #mapNationalPop {
    position: absolute; top: 4vh; left: 4vh; z-index: 1;
    background: rgba(0,0,0,.55); padding: 1.2vh 1.8vh; border-radius: 10px;
    backdrop-filter: blur(3px); color: #fff; max-width: 44vw;
  }
  #mapNationalPop:empty { display: none; }
  #mapNationalPop .natpop-main {
    font: 800 clamp(15px, 1.9vw, 26px)/1.3 "Inter", Arial, sans-serif;
  }
  #mapNationalPop .natpop-sub {
    font: 500 clamp(11px, 1.2vw, 16px)/1.4 "Inter", Arial, sans-serif;
    opacity: .82; margin-top: .3vh;
  }
  .map-legend-row {
    display: flex; align-items: center; gap: 0.8vh;
    font: 700 clamp(13px, 1.5vw, 22px)/1.3 "Inter", Arial, sans-serif; color: #fff;
    white-space: nowrap;
  }
  .map-legend-dot { width: 1vw; height: 1vw; min-width: 10px; min-height: 10px; border-radius: 50%; border: 2px solid #fff; flex: none; }
  .map-pin-dot {
    position: absolute; width: 1.4vw; height: 1.4vw; min-width: 14px; min-height: 14px;
    margin: -0.7vw 0 0 -0.7vw; border-radius: 50%;
    background: #e2483d; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.55);
    animation: mapPinPulse_ 1.8s ease-in-out infinite;
  }
  /* BARU (9 Sep 2026, permintaan operator) -- "animasi besar kecil
     seperti Google Maps menunjuk tempat": pin bernapas pelan terus-
     menerus (bukan cuma sekali muncul) supaya peta terasa hidup/
     interaktif, bukan gambar statis. Delay per-pin diacak sedikit lewat
     nth-child supaya semua pin TIDAK berdenyut serentak (terlihat lebih
     alami, seperti kelap-kelip kota). */
  .map-pin-dot:nth-child(3n) { animation-delay: .3s; }
  .map-pin-dot:nth-child(3n+1) { animation-delay: .6s; }
  .map-pin-dot:nth-child(5n) { animation-delay: .9s; }
  @keyframes mapPinPulse_ {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.22); }
  }
  /* BARU (9 Sep 2026, permintaan operator) -- "🎨 Gaya Pin: 3D Berputar"
     di Layar 2. Sama seperti .ps-pin-3d di css/style.css (Studio) --
     disalin di sini karena present.html adalah dokumen HTML terpisah,
     tidak memuat css/style.css. Lihat komentar panjang di
     css/style.css untuk penjelasan kenapa ini "sorot bergeser" bukan
     rotasi 3D sungguhan, dan kenapa @property dipakai. */
  @property --hl { syntax: '<percentage>'; initial-value: 30%; inherits: false; }
  .map-pin-dot.pin-3d {
    background: radial-gradient(circle at var(--hl) 30%, #ffffff 0%, var(--pin3d-color, #e2483d) 42%, color-mix(in srgb, var(--pin3d-color, #e2483d) 65%, #000) 100%);
    animation: mapPinPulse_ 1.8s ease-in-out infinite, mapPin3DSpin_ 3.4s linear infinite;
  }
  @keyframes mapPin3DSpin_ { 0% { --hl: 15%; } 50% { --hl: 85%; } 100% { --hl: 15%; } }
  .map-pin-label {
    position: absolute; transform: translate(-50%, -150%);
    background: rgba(0,0,0,.72); color: #fff; padding: 4px 12px; border-radius: 6px;
    font: 700 clamp(12px, 1.4vw, 22px)/1.3 "Inter", Arial, sans-serif; white-space: nowrap;
  }
  /* BARU (9 Sep 2026, permintaan operator) -- 📇 Kartu Info Kota, muncul
     HANYA saat "🎯 Fokus" ditekan (zoom ke 1 pin) -- lihat
     focusMapPin()/renderMapInfoCard_() di skrip bawah. Sengaja bukan
     label permanen di atas pin (beda dari .map-pin-label) supaya peta
     yang ratusan titik tetap bersih; kartu ini cuma tampil untuk 1 titik
     yang sedang difokuskan, di pojok kiri-bawah supaya tidak menutupi
     titik yang lagi di-zoom (yang selalu digeser ke TENGAH layar). */
  #mapInfoCard {
    position: absolute; left: 4vh; bottom: 4vh; z-index: 1;
    background: rgba(0,0,0,.62); backdrop-filter: blur(3px);
    padding: 1.6vh 2.2vh; border-radius: 12px;
    max-width: 46vw; color: #fff;
    font: 500 clamp(13px, 1.5vw, 20px)/1.4 "Inter", Arial, sans-serif;
    opacity: 0; transform: translateY(10px);
    transition: opacity .5s ease, transform .5s ease;
  }
  #mapInfoCard.show { opacity: 1; transform: translateY(0); }
  #mapInfoCard .map-info-name {
    font: 800 clamp(18px, 2.4vw, 30px)/1.25 "Inter", Arial, sans-serif;
    margin-bottom: .4vh;
  }
  #mapInfoCard .map-info-cat { opacity: .85; margin-bottom: .6vh; }
  #mapInfoCard .map-info-row { opacity: .92; }
  #mapInfoCard .map-info-dot {
    display: inline-block; width: .8vw; height: .8vw; min-width: 9px; min-height: 9px;
    border-radius: 50%; margin-right: 6px; border: 2px solid #fff;
  }
  /* BARU (9 Sep 2026, permintaan operator) -- strip foto (maks 5) di
     bawah kartu info, kalau operator sudah unggah lewat "📷 Foto" di
     Studio -- lihat renderMapInfoCard_() di bawah. */
  #mapInfoCard .map-info-photos { display: flex; gap: .6vh; margin-top: .8vh; }
  #mapInfoCard .map-info-photos img {
    width: 8vh; height: 8vh; object-fit: cover; border-radius: 6px;
    border: 2px solid rgba(255,255,255,.85);
  }

  /* BARU (9 Sep 2026, permintaan operator) -- 🎡 Roda Undian (versi teks
     saja -- versi foto per-segmen direncanakan tahap berikutnya). z-index
     SAMA dengan #stage/#mapView (2) -- saling meniadakan, tidak pernah
     tampil berbarengan, lihat showWheel()/spinWheel() di skrip bawah.
     Putaran dianimasikan lewat CSS transform+transition pada #wheelCanvas
     itu sendiri (bukan menggambar ulang tiap frame) -- ringan & mulus. */
  #wheelView {
    display: none; position: fixed; inset: 0; z-index: 2;
    background: #17110d; overflow: hidden;
    align-items: center; justify-content: center; flex-direction: column;
  }
  #wheelView:not([hidden]) { display: flex; animation: fadeInOnly .4s ease both; }
  #wheelCanvasWrap { position: relative; width: min(72vh, 72vw); height: min(72vh, 72vw); }
  #wheelCanvas { width: 100%; height: 100%; display: block; transform-origin: 50% 50%; filter: drop-shadow(0 6px 22px rgba(0,0,0,.5)); }
  #wheelPointer {
    position: absolute; top: -1.6vh; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 2vh solid transparent; border-right: 2vh solid transparent;
    border-top: 3.4vh solid #fff; filter: drop-shadow(0 2px 5px rgba(0,0,0,.55)); z-index: 3;
  }
  #wheelWinnerBanner {
    margin-top: 3.4vh; font: 800 clamp(24px, 4.2vw, 58px)/1.2 "Inter", Arial, sans-serif;
    color: #ffd23d; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,.6);
    min-height: 1em;
  }

  #stage {
    position: relative; z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5vh calc(6vw / var(--p-content-scale, 1));
    box-sizing: border-box;
    transition: background-color .3s ease, color .3s ease, padding .25s ease;
  }
  #ref {
    font-family: "Inter", Arial, sans-serif;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--p-cam-ink, var(--p-accent));
    font-size: calc(clamp(16px, 2.4vw, 30px) * var(--p-scale));
    margin-bottom: clamp(14px, 2.4vh, 34px);
    opacity: 0.92;
    /* BARU (28 Agu 2026) -- lihat catatan panjang di #text di bawah:
       warna & garis tepi ini hanya berubah saat 🎥 Kamera Latar aktif
       (--p-cam-ink/--p-outline-shadow terisi), jatuh ke tampilan lama
       (var(--p-accent), tanpa outline) selebihnya -- lihat
       applyCamTextStyle() di skrip bawah. */
    text-shadow: var(--p-outline-shadow, none);
  }
  #ref::before, #ref::after {
    content: "—"; opacity: 0.55; margin: 0 0.6em; font-weight: 400;
  }
  /* BARU (4 Sep 2026) -- baris kecil kedua ("Witness Lee B 4/4 (7 Bait)")
     di bawah judul kidung -- sengaja TIDAK pakai huruf besar semua/garis
     "—" seperti #ref di atas (supaya terasa sebagai keterangan kecil,
     bukan judul kedua), warna sedikit lebih redup dari warna tulisan
     utama tapi tetap ikut var(--p-ink) tema supaya kontrasnya selalu
     terjaga di tema apa pun (Terang/Sepia/Putih/Krem dst). */
  #refSub {
    font-family: "Inter", Arial, sans-serif;
    font-weight: var(--p-font-weight, 500);
    color: var(--p-cam-ink, var(--p-ink));
    opacity: 0.75;
    font-size: calc(clamp(14px, 1.6vw, 20px) * var(--p-scale));
    margin-top: clamp(-10px, -1.6vh, -4px);
    margin-bottom: clamp(14px, 2.4vh, 34px);
    text-shadow: var(--p-outline-shadow, none);
  }
  #text {
    font-weight: var(--p-font-weight, 400);
    font-size: calc(clamp(28px, 4.6vw, 68px) * var(--p-scale));
    /* BARU (28 Agu 2026) -- dulu terkunci "1.35" tetap, sekarang bisa
       diatur dari Studio (slider "Spasi Baris", lihat --p-line-height
       di applyTheme()/js/presentation-studio.js) supaya teks panjang
       (mis. hasil unggah file Word/.doc) bisa dirapatkan/direnggangkan
       spasi antar barisnya tanpa mengubah ukuran hurufnya. */
    line-height: var(--p-line-height, 1.35);
    max-width: calc(1200px * var(--p-content-scale, 1));
    white-space: pre-wrap;
    /* BARU (28 Agu 2026) -- 🎥 Kamera Latar: --p-cam-ink & --p-outline-shadow
       cuma TERISI saat kamera aktif (diset lewat applyCamTextStyle() di
       bawah) -- kalau tidak, var() jatuh ke nilai lama (var(--p-ink),
       tanpa outline) persis seperti sebelum fitur ini ada, jadi TIDAK
       mengubah tampilan sama sekali kalau kamera tidak dipakai. */
    color: var(--p-cam-ink, var(--p-ink));
    text-shadow: var(--p-outline-shadow, none), 0 2px 18px rgba(0,0,0,0.5);
  }
  #idle {
    font-family: "Inter", Arial, sans-serif;
    color: #6b7280;
    font-size: clamp(16px, 2vw, 22px);
  }
  /* Blok tumpuk saat beberapa versi/terjemahan ditampilkan sekaligus
     (checklist versi di Studio Presentasi). Ukuran font otomatis lebih
     kecil supaya semua versi tetap muat 1 layar tanpa scroll. */
  .verse-version-block {
    display: block;
    margin: 0 auto clamp(18px, 2.6vh, 30px);
    font-size: calc(clamp(20px, 3vw, 42px) * var(--p-scale));
  }
  .verse-version-block:last-child { margin-bottom: 0; }
  .verse-version-tag {
    display: inline-block;
    font-family: "Inter", Arial, sans-serif;
    font-weight: 700;
    font-size: 0.42em;
    letter-spacing: 0.06em;
    color: var(--p-accent);
    background: color-mix(in srgb, var(--p-accent) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--p-accent) 45%, transparent);
    border-radius: 6px;
    padding: 0.15em 0.55em;
    margin-right: 0.5em;
    vertical-align: middle;
    transform: translateY(-0.15em);
  }
  #stage.fade-in #text, #stage.fade-in #ref { animation: fadeUp .5s ease both; }
  /* Slide Kidung (Presentation.sendKidung()) -- bait polos memakai warna
     tulisan tema biasa (var(--p-ink)), koor DISOROT kuning tetap (TIDAK
     ikut var(--p-ink)/tema) supaya selalu jelas kelihatan "ini bagian
     koor" di tema apa pun (gelap/terang/sepia/dst -- lihat THEMES di
     js/presentation-studio.js), meniru mockup layar biru-kuning yang
     dicontohkan. */
  .kidung-bait-line {
    /* BARU (4 Sep 2026, permintaan operator) -- jarak antar BLOK bait
       (dulu clamp() tetap, TIDAK ikut slider "Spasi Baris" sama sekali --
       jadi kalau jarak ini terasa kebesaran, operator tidak py cara
       mengecilkannya). Sekarang ikut skala var(--p-line-height) yang
       sama dipakai slider itu (nilai bawaan 1.35 => rasio 1, tidak
       berubah kalau slider belum disentuh sama sekali) -- geser slider
       ke kiri (mis. 60%) merapatkan jarak antar bait JUGA, bukan cuma
       spasi antar baris di dalam 1 bait yang panjang. */
    margin: 0 auto calc(clamp(10px, 1.6vh, 20px) * var(--p-line-height, 1.35) / 1.35);
  }
  .kidung-line-gap { display: block; height: calc(clamp(6px, 1vh, 14px) * var(--p-line-height, 1.35) / 1.35); }
  .kidung-koor-line {
    color: var(--p-koor, #ffd84a);
    font-weight: 600;
  }
  .kidung-koor-label {
    display: inline-block;
    font-family: "Inter", Arial, sans-serif;
    font-weight: 700;
    font-size: 0.5em;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 0.3em;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  /* BARU (7 Sep 2026) -- KHUSUS untuk elemen yang posisinya sendiri
     SUDAH diatur lewat `transform` (mis. #timerClockWrap & varian
     tc-pos-*-nya, lihat catatan panjang di rule itu) -- "fadeUp" di
     ATAS TIDAK BOLEH dipakai untuk elemen semacam itu: keyframe
     "to { transform:none; }"-nya, digabung `animation-fill-mode:both`,
     MENIMPA/MENGHAPUS transform apa pun yang sudah diberi elemen itu
     lewat CSS biasa (animasi SELALU menang atas rule non-animasi untuk
     properti yang sama) -- begitu animasi ini berjalan (setiap kali
     elemen berpindah dari `hidden` ke tampil), transform:translate(-50%,
     -50%)" (dan sejenisnya di tc-pos-top/bottom/left/right) ikut
     KETIMPA jadi `none` PERMANEN setelah animasi selesai, sehingga
     kotaknya nempel di titik 50%/50% APA ADANYA (cuma sudut kiri-atas
     kotak yang di tengah, bukan kotaknya) -- persis akar masalah
     "Jam Target tidak tepat di tengah" yang dilaporkan operator. Ganti
     dengan animasi INI (cuma opacity, tidak menyentuh transform sama
     sekali) untuk elemen semacam itu. */
  @keyframes fadeInOnly { from { opacity:0; } to { opacity:1; } }

  #logoView { max-width: 60vw; max-height: 60vh; object-fit: contain; }
  /* Slide dari File tab (gambar/pptx/pdf yang sudah dikonversi
     per-slide) -- tampil penuh 1 layar, beda dari #logoView yang
     sengaja dibatasi kecil di tengah. */
  #slideView { max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; }
  /* Video YouTube -- penuh 1 layar, sama seperti #slideView. */
  /* PERBAIKAN (4 Sep 2026, permintaan operator): dulu iframe ini BISA
     diklik langsung (kontrol bawaan YouTube-nya sendiri, termasuk
     segitiga ▶️ besar di tengah) -- operator yang mengklik segitiga
     itu langsung membuat video tayang ke jemaat SEBELUM operator siap,
     tanpa lewat alur ▶️ Play resmi di Studio (yang seharusnya jadi
     SATU-SATUNYA cara memulai). Sekarang iframe ini dibuat
     pointer-events:none (sama seperti pola yang sudah dipakai untuk
     iframe pratinjau mini di Studio, lihat toStudioPreviewEmbedUrl() &
     renderStudioPreview() di js/presentation-studio.js) -- video tetap
     tampil penuh 1 layar seperti biasa, tapi TIDAK BISA disentuh
     langsung: klik/sentuh di mana pun pada video ini tidak berbuah
     apa-apa, satu-satunya cara main/jeda/lompat tetap lewat
     ▶️/⏸️/🔇/progress bar di Studio (dikirim lewat postMessage, lihat
     "yt_control" di bawah). Lapisan #activateOverlay (klik sekali utk
     aktifkan suara) TIDAK terpengaruh -- dia berada DI ATAS #ytView
     (z-index lebih tinggi) & baru hilang SETELAH diklik, jadi urutan
     klik pertama tetap berhasil mendaratkan klik ke overlay itu (atau
     ke halaman di belakangnya), bukan ke video. */
  #ytView { width: 100vw; height: 100vh; position: fixed; inset: 0; border: none; pointer-events: none; }
  /* BARU (7 Sep 2026) -- lihat catatan panjang di HTML <video id="localVideoEl">
     di atas. `object-fit:contain` supaya video apa pun rasionya (16:9,
     4:3, potrait dari HP, dst) tidak terpotong/gepeng -- ditambah latar
     hitam di belakangnya (sama seperti bioskop) lewat #stage yang sudah
     gelap, ATAU lewat background:#000 di sini kalau tema terang sedang
     aktif (supaya video tidak "mengambang" di atas warna tema terang). */
  #localVideoEl {
    width: 100vw; height: 100vh; position: fixed; inset: 0; border: none;
    object-fit: contain; background: #000; z-index: 1;
  }
  /* BARU (4 Sep 2026) -- embed Canva ("🤖 AI Presentation" roadmap,
     Bagian 3). BEDA dari #ytView: Canva TIDAK punya API kontrol
     jarak-jauh resmi (tidak ada play/pause/seek lewat postMessage
     seperti YouTube IFrame API) -- satu-satunya cara maju/mundur
     slide-nya adalah klik langsung di iframe ini sendiri (tombol
     bawaan Canva, atau panah keyboard saat jendela ini fokus).
     Karena itu #canvaView SENGAJA TIDAK diberi pointer-events:none
     (beda dari #ytView) -- operator harus bisa mengklik langsung ke
     dalamnya untuk menggerakkan slide Canva. */
  #canvaView { width: 100vw; height: 100vh; position: fixed; inset: 0; border: none; background: #05070c; }
  /* BARU (4 Sep 2026) -- embed SoundCloud (roadmap Bagian 4). Widget
     SoundCloud dirancang sebagai bilah pemutar (bukan penuh 1 layar) --
     ditaruh di bagian bawah layar supaya ayat/pengumuman/kidung yang
     sedang tayang (di belakangnya, lewat #text/#ref) tetap bisa dibaca
     penuh sementara audio jalan (mirip semangat "Latar Suara Saja" di
     tab YouTube), TAPI beda dari Audio Latar YouTube: di sini widget-nya
     memang dimaksudkan untuk TERLIHAT (progress bar & tombol bawaan
     SoundCloud), bukan disembunyikan. Kontrol Play/Pause dari Studio
     tetap jalan lewat SC Widget API (lihat "sc_control" & SC.Widget di
     skrip bawah) walau widget bawaan ini kelihatan -- operator boleh
     pakai salah satu (tombol Studio ATAU klik langsung di bilah ini,
     keduanya sinkron karena sama-sama lewat 1 objek SC.Widget). */
  #scView { width: 100vw; height: 166px; position: fixed; left: 0; right: 0; bottom: 0; border: none; }
  /* Audio Latar YouTube ("Latar suara saja" di Studio) -- video ASLI
     tetap dimuat & diputar (supaya suaranya jalan), tapi disembunyikan
     SECARA VISUAL (opacity:0, bukan display:none/hidden -- display:none
     pada sebagian browser ikut menghentikan audionya). pointer-events:
     none supaya tidak menghalangi klik/Penunjuk di ayat yang tampil di
     atasnya. z-index di bawah #stage supaya ayat/pengumuman tetap yang
     "aktif" terlihat (meski secara visual video ini memang tidak kelihatan
     sama sekali karena opacity 0). */
  #ytBg { width: 100vw; height: 100vh; position: fixed; inset: 0; border: none; opacity: 0; pointer-events: none; z-index: 0; }

  /* ---- Warta (atas) & FootNote (bawah): ticker 1 baris ----
     Warna latar ticker sengaja TETAP hitam solid (bukan ikut var(--p-bg))
     supaya tulisan putihnya selalu kontras tinggi apa pun tema latar
     panggung yang sedang aktif. */
  .ticker-bar {
    position: fixed; left: 0; right: 0; z-index: 20;
    /* PERBAIKAN (7 Sep 2026, laporan operator "bar-nya nyatu sama latar
       gelap, jadi kelihatannya kosong") -- opacity latar dinaikkan
       (0.82 -> 0.92) & sedikit lebih pekat dari hitam solid, supaya
       bar ini tetap kelihatan sebagai lapisan TERPISAH biarpun tema
       Layar Proyeksi yang aktif sama-sama gelap (mis. "Gelap"/
       "Biru Malam") -- garis tepi emas di #wartaBar/#footBar/#msgMidBar
       di bawah juga dipertegas (opacity dinaikkan) untuk alasan yang
       sama. */
    background: rgba(6,6,10,0.92);
    backdrop-filter: blur(2px);
    color: #fff;
    font-family: "Inter", Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(15px, 1.6vw, 24px);
    padding: 12px 0;
    overflow: hidden;
    white-space: nowrap;
    animation: fadeUp .3s ease both;
  }
  #wartaBar { top: 0; box-shadow: 0 6px 18px rgba(0,0,0,0.35); border-bottom: 2px solid rgba(216,180,92,0.6); }
  #footBar { bottom: 0; box-shadow: 0 -6px 18px rgba(0,0,0,0.35); border-top: 2px solid rgba(216,180,92,0.6); }
  /* BARU (7 Sep 2026) -- #msgMidBar: SAMA seperti #wartaBar/#footBar
     (posisi tetap terhadap LAYAR, bukan terhadap #stage), cuma nempel
     di TENGAH (bukan mepet atas/bawah) -- transform:translateY(-50%)
     dari titik top:50% supaya bar-nya sendiri yang dipusatkan (bukan
     cuma teks di dalamnya), persis seperti "1 baris melayang di tengah
     layar" yang diminta operator. */
  #msgMidBar { top: 50%; transform: translateY(-50%); box-shadow: 0 0 24px rgba(0,0,0,0.5); border: 2px solid rgba(216,180,92,0.6); }
  .ticker-bar .ticker-inner {
    display: inline-block;
    padding-left: 100%;
    /* BARU (7 Sep 2026 v3, permintaan operator) -- A+/A- khusus ukuran
       huruf 💬 Pesan (terpisah dari A+/A- ayat/kidung/pengumuman biasa),
       lihat --p-msg-scale (:root & applyTicker() di bawah) &
       wireMessage() (js/presentation-studio.js). 1 (100%) = ukuran
       bawaan, TIDAK berubah kalau operator belum pernah menekan A+/A-
       pesan sama sekali. */
    font-size: calc(1em * var(--p-msg-scale, 1));
  }
  /* PERBAIKAN (7 Sep 2026 v3, laporan operator "pesan Berjalan harus
     dipancing dulu, & pas jalan kecepatannya terlalu cepat") -- akar
     masalahnya DUA hal sekaligus:
       1) Shorthand `animation: tickerScroll linear infinite;` di sini
          TIDAK menyebutkan durasi sama sekali -- CSS otomatis jatuh ke
          durasi 0 detik (nyaris tidak kelihatan bergerak / meloncat
          instan), makanya terasa "kadang tidak muncul, kadang meloncat
          cepat" tergantung timing render browser. Sekarang dikasih
          durasi CADANGAN wajar (12 detik) di sini SEKALIGUS.
       2) BUG SUNGGUHAN (bukan cuma cadangan): applyTicker() di skrip
          bawah SEBELUMNYA memasang durasi lewat
          `textEl2.parentElement.style.animationDuration = ...` -- itu
          keliru taruh di elemen BAR PEMBUNGKUS (yang animasinya cuma
          "fadeUp" masuk-ke-layar, TIDAK ADA hubungannya dengan geser
          marquee), BUKAN di `textEl2` sendiri (.ticker-inner, tempat
          animasi "tickerScroll" SEBENARNYA dipasang lewat class
          "scrolling" di bawah ini) -- jadi durasi kustom dari Studio
          (mis. kecepatan Lambat/Sedang/Cepat) tidak pernah benar-benar
          sampai ke animasi yang seharusnya, dan durasi 0 detik
          bawaan (poin 1) yang selalu dipakai. Sudah diperbaiki di
          applyTicker() (cari "PERBAIKAN (7 Sep 2026 v3" di bawah). */
  .ticker-bar.scrolling .ticker-inner {
    animation: tickerScroll 12s linear infinite;
  }
  /* PERBAIKAN (7 Sep 2026, laporan operator "isi 2 baris tapi tampil
     1 baris panjang") -- SEBELUMNYA "white-space: normal" di sini
     mengikuti aturan HTML biasa: karakter baris baru (\n) dari textarea
     DIABAIKAN TOTAL (dianggap 1 spasi biasa), jadi pesan yang diketik
     2 baris terpisah selalu digabung jadi 1 baris utuh (baru dipotong
     otomatis kalau kepanjangan untuk lebar layar, BUKAN mengikuti Enter
     yang diketik operator). "pre-line" TETAP membungkus teks yang
     kepanjangan seperti biasa (tidak meluber ke luar layar), TAPI JUGA
     menghormati Enter yang diketik operator -- 2 baris diketik = 2
     baris tampil, persis seperti yang diminta. Baris ini HANYA berlaku
     saat "▶️ Berjalan" (marquee) MATI (class "static") -- saat marquee
     NYALA baris baru tetap digabung 1 baris memanjang (lihat applyTicker()
     di skrip bawah), karena marquee bergeser HORIZONTAL, tidak masuk akal
     kalau isinya bertumpuk banyak baris sekaligus. */
  .ticker-bar.static { white-space: normal; text-align: center; padding: 10px 4vw; }
  .ticker-bar.static .ticker-inner { white-space: pre-line; padding-left: 0; }
  @keyframes tickerScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }
  /* BARU (7 Sep 2026 v2, permintaan operator) -- mode "Berdenyut": teks
     diam DI TEMPAT (posisi TIDAK berubah) tapi ukurannya membesar sampai
     150% lalu mengecil balik ke 100%, berulang terus (infinite) sampai
     pesan ditutup/diganti dari Studio. Dipasang di SPAN teksnya sendiri
     (.ticker-inner), BUKAN di bar pembungkusnya, supaya latar/border bar
     tetap diam -- cuma hurufnya yang "bernafas". transform-origin:center
     supaya membesarnya merata ke segala arah dari titik tengah, tidak
     condong ke salah satu sisi. Kecepatan (lama 1 putaran) diatur lewat
     `animationDuration` inline (lihat applyTicker() di skrip bawah),
     bukan angka tetap di sini -- operator bisa pilih 1/2/3 detik atau
     custom dari Studio. */
  @keyframes tickerPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.5); }
  }
  .ticker-bar .ticker-inner.pulsing {
    transform-origin: 50% 50%;
    animation-name: tickerPulse;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  /* Mode "Berdenyut" butuh ruang lebih supaya huruf yang membesar 150%
     tidak terpotong oleh `overflow:hidden` bawaan .ticker-bar (yang
     sebetulnya dipasang supaya marquee bisa "menghilang" rapi di tepi
     layar) -- untuk mode ini overflow dilonggarkan & padding vertikal
     ditambah sedikit. */
  .ticker-bar.pulse-mode { overflow: visible; padding-top: 24px; padding-bottom: 24px; }

  /* ---- Timer ----
     PENTING: jangan taruh `display:flex` langsung di #timerWrap. Selector
     ID (#timerWrap) punya spesifisitas LEBIH TINGGI daripada selector
     atribut bawaan browser `[hidden]{display:none}`, jadi kalau
     `display:flex` ditulis langsung di sini, atribut hidden yang
     dipasang/dilepas lewat JS (timerWrap.hidden = true/false) tidak
     pernah benar-benar menyembunyikannya -- ini penyebab timer bisa
     "nyangkut" tetap kelihatan menimpa ayat berikutnya, atau terlihat
     tidak konsisten. Solusi: default-kan ke display:none, baru
     `:not([hidden])` yang menaikkan ke flex -- jadi atribut hidden
     TETAP jadi sumber kebenaran satu-satunya. */
  #timerWrap { display: none; align-items: center; justify-content: center; gap: 6vw; }
  #timerWrap:not([hidden]) { display: flex; animation: fadeUp .4s ease both; }
  #timerRing {
    /* BARU (6 Sep 2026, permintaan operator) -- lihat catatan panjang
       --p-timer-scale di <style> atas. SVG otomatis membesarkan ISINYA
       (lingkaran & angka #timerTime di dalamnya) mengikuti lebar/tinggi
       kotaknya sendiri (viewBox 0 0 100 100), jadi cukup kalikan width/
       height di sini -- tidak perlu font-size terpisah untuk #timerTime. */
    width: calc(min(32vh, 30vw) * var(--p-timer-scale));
    height: calc(min(32vh, 30vw) * var(--p-timer-scale));
    filter: drop-shadow(0 4px 24px rgba(0,0,0,0.35));
    max-width: 92vw; max-height: 85vh; /* jangan sampai tumpah keluar layar walau scale sangat besar */
  }
  #timerRing circle { fill: none; stroke-width: 7; }
  #timerRingBg { stroke: color-mix(in srgb, var(--p-ink) 16%, transparent); }
  #timerRingFg { stroke: var(--p-accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s ease; }
  #timerRingFg.done { stroke: #d9463a; }
  #timerTime {
    font-family: "Inter", Arial, sans-serif;
    font-weight: 700;
    fill: var(--p-ink);
    font-size: 15px;
  }
  #timerLabel {
    font-family: "Inter", Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
    font-size: calc(clamp(22px, 3.6vw, 46px) * var(--p-scale));
  }
  #timerTime.done-text { fill: #d9463a; }

  /* ---- BARU (7 Sep 2026, permintaan operator) -- 🎯 Countdown ke Jam
     Target: BEDA dari #timerWrap (cincin) di atas -- SENGAJA tanpa
     cincin, cuma teks polos (caption opsional + angka JAM:MENIT:DETIK
     besar), diposisikan ABSOLUTE PERSIS di tengah panggung (top:50%,
     left:50%). #stage sudah `position:relative` (lihat CSS #stage di
     atas) jadi absolute di sini terhitung relatif ke panggung itu,
     BUKAN ke seluruh jendela browser. Pola display:none/:not([hidden])
     SAMA seperti #timerWrap (alasannya sama persis -- lihat catatan
     panjang di situ).
     DIPERBAIKI (7 Sep 2026, laporan operator) -- sebelumnya top:60%
     (sengaja digeser turun dari permintaan lain, supaya tidak menutupi
     bagian atas 🖼️ Latar Gambar). Itu justru bikin kotak ini TIDAK
     pernah pas di tengah secara tinggi seperti yang diminta sekarang --
     dikembalikan ke top:50% (tengah persis). Kalau nanti perlu digeser
     lagi khusus saat Latar Gambar aktif, sebaiknya lewat rule terpisah
     (mis. body.cam-active #timerClockWrap { top: 60%; }), bukan menimpa
     nilai default di sini lagi. */
  #timerClockWrap {
    display: none; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4vh; z-index: 3; text-align: center; max-width: 92vw;
  }
  #timerClockWrap:not([hidden]) {
    display: flex;
    /* PERBAIKAN (7 Sep 2026, laporan operator "Jam Target tidak tepat di
       tengah") -- SEBELUMNYA "animation: fadeUp .4s ease both;" (SAMA
       seperti #timerWrap/#stopwatchWrap di atas). BEDANYA: #timerWrap &
       #stopwatchWrap TIDAK butuh `transform` sama sekali untuk posisinya
       (dipusatkan lewat flex align-items/justify-content biasa di
       #stage), sedangkan kotak INI (#timerClockWrap) posisinya sendiri
       ditentukan lewat `transform: translate(...)` (lihat rule di atas &
       varian .tc-pos-top/bottom/left/right). "fadeUp" keyframe "to"-nya
       eksplisit set `transform:none` -- karena animasi SELALU menang
       atas rule non-animasi untuk properti yang sama, ini MENIMPA/
       MENGHAPUS translate(-50%,-50%) yang sedianya memusatkan kotak,
       jadi kotaknya nempel di titik acuan 50%/50% APA ADANYA (cuma
       sudut kiri-atas kotak yang tepat di tengah layar, bukan tengah
       kotaknya) -- makin lebar kotaknya (caption+angka jam panjang),
       makin kelihatan "melenceng ke kanan-bawah". "fadeInOnly" di atas
       cuma menganimasikan opacity, TIDAK PERNAH menyentuh transform,
       jadi translate(-50%,-50%)/tc-pos-* di atas tetap utuh sepanjang
       & sesudah animasi. */
    animation: fadeInOnly .4s ease both;
  }
  #timerClockCaption {
    font-family: "Inter", Arial, sans-serif; font-weight: 700; letter-spacing: 0.01em;
    font-size: calc(clamp(20px, 3.2vw, 42px) * var(--p-scale));
    /* DIPERBAIKI (7 Sep 2026, laporan operator) -- sebelumnya SELALU
       var(--p-ink) (warna tulisan tema umum), jadi kalau operator pilih
       warna khusus "Putih" dkk. di "WARNA ANGKA COUNTDOWN", cuma angka
       jam yang berubah putih sedangkan caption di atasnya tetap warna
       ink tema (mis. krem/emas) -- terlihat "belum putih semua" persis
       seperti dilaporkan. Sekarang caption ikut --p-timerclock-color
       yang sama dengan angka jam kalau operator memilihnya, dan cuma
       jatuh ke var(--p-ink) seperti sebelumnya saat "Ikut Tema" (nilai
       kosong). */
    color: var(--p-timerclock-color, var(--p-ink));
    text-shadow: var(--p-timerclock-stroke, none);
  }
  #timerClockCaption[hidden] { display: none; }

  /* BARU (9 Sep 2026, permintaan operator) -- "Mode Layar" umum: dipakai
     untuk 2 jenis layar baru, "welcome" (layar sambutan sebelum acara
     mulai, isi: judul + subjudul + poin-poin penting + opsional
     hitung mundur ke jam mulai) & "nextup" (layar "SELANJUTNYA" di
     antara sesi, isi: judul kecil "SELANJUTNYA" + nama sesi + opsional
     hitung mundur singkat). SATU komponen (#modeScreenView), beda isi
     saja lewat class ms-welcome/ms-nextup di <body> -- lihat
     showModeScreen() di skrip bawah & wireModeScreenTab() di
     js/presentation-studio.js. Dipusatkan PERSIS pola #timerClockWrap
     di atas (translate -50%/-50%) supaya konsisten di semua tema/skala. */
  #modeScreenView {
    display: none; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6vh; z-index: 3; text-align: center; max-width: 88vw;
  }
  #modeScreenView:not([hidden]) { display: flex; animation: fadeInOnly .4s ease both; }
  #msEyebrow {
    font-family: "Inter", Arial, sans-serif; font-weight: 800; letter-spacing: 0.12em;
    font-size: calc(clamp(14px, 2vw, 26px) * var(--p-scale));
    color: var(--p-timerclock-color, var(--p-accent, #d8b45c));
    text-transform: uppercase;
  }
  #msEyebrow[hidden], #msSubtitle[hidden], #msCountdown[hidden], #msBullets[hidden], #msNextLabel[hidden] { display: none; }
  #msTitle {
    font-family: "Inter", Arial, sans-serif; font-weight: 800;
    font-size: calc(clamp(28px, 5.4vw, 84px) * var(--p-scale));
    color: var(--p-timerclock-color, var(--p-ink));
    text-shadow: var(--p-timerclock-stroke, none);
    line-height: 1.15;
  }
  #msSubtitle {
    font-family: "Inter", Arial, sans-serif; font-weight: 600;
    font-size: calc(clamp(18px, 2.6vw, 38px) * var(--p-scale));
    color: var(--p-timerclock-color, var(--p-ink)); opacity: 0.92;
  }
  #msCountdown {
    font-family: "Inter", Arial, sans-serif; font-weight: 800; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    font-size: calc(clamp(30px, 6vw, 96px) * var(--p-scale));
    color: var(--p-timerclock-color, var(--p-ink));
    text-shadow: var(--p-timerclock-stroke, none);
    margin-top: 0.4vh;
  }
  #msBullets {
    list-style: none; margin: 1vh 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.9vh;
    font-family: "Inter", Arial, sans-serif; font-weight: 600;
    font-size: calc(clamp(16px, 1.8vw, 30px) * var(--p-scale));
    color: var(--p-timerclock-color, var(--p-ink)); opacity: 0.95;
  }
  #msBullets li::before { content: "•  "; opacity: 0.7; }
  /* BARU (9 Sep 2026, permintaan operator) -- baris "➡️ Selanjutnya: ..."
     (Layar Istirahat Lengkap), dibuat SENGAJA lebih kecil & redup dari
     #msTitle/#msSubtitle supaya jelas ini keterangan TAMBAHAN, bukan
     fokus utama layar (fokus utama tetap jam mundur/#msCountdown atau
     judul). Sedikit dipisah jarak (margin-top) & diberi garis tipis di
     atasnya supaya terlihat sebagai "bagian lain" dari layar yang sama. */
  #msNextLabel {
    font-family: "Inter", Arial, sans-serif; font-weight: 700;
    font-size: calc(clamp(15px, 1.7vw, 26px) * var(--p-scale));
    color: var(--p-timerclock-color, var(--p-ink)); opacity: 0.85;
    margin-top: 1.2vh; padding-top: 1.2vh;
    border-top: 1px solid color-mix(in srgb, var(--p-timerclock-color, var(--p-ink)) 30%, transparent);
  }
  /* Layar "SELANJUTNYA" (nextup) dibuat lebih ringkas -- judul sesi
     jadi fokus utama, eyebrow "SELANJUTNYA" kecil di atasnya. */
  body.ms-nextup #msTitle { font-size: calc(clamp(24px, 4.4vw, 68px) * var(--p-scale)); }

  /* BARU (9 Sep 2026, permintaan operator) -- 4 preset "Jenis Layar"
     tambahan (☕ Istirahat, 🎉 Ice Breaker, 🏃 Olahraga, 🙏 Renungan
     Malam), lihat MODE_SCREEN_KIND_META di js/presentation-studio.js
     untuk teks bawaan & showModeScreen() di skrip bawah untuk class
     body-nya. SENGAJA hanya menyentuh warna eyebrow/aksen (BUKAN
     background penuh) supaya "Ikut Tema" (warna latar pilihan operator,
     var(--p-bg)/var(--p-accent)) tetap dihormati -- cukup jadi nuansa
     kecil yang membedakan suasana tiap jenis tanpa terasa kaku/seragam. */
  body.ms-istirahat #msEyebrow { color: #e0a458; } /* hangat, secangkir kopi */
  body.ms-icebreaker #msEyebrow { color: #ff6f91; } /* ceria */
  body.ms-icebreaker #msTitle { letter-spacing: 0.01em; }
  body.ms-olahraga #msEyebrow { color: #ff6a45; } /* energik */
  body.ms-olahraga #msTitle { font-weight: 900; }
  /* Renungan Malam dibuat lebih TENANG/hening: eyebrow redup, subjudul
     miring, transisi lebih lambat -- kebalikan dari Ice Breaker/Olahraga
     yang tegas & energik di atas. */
  body.ms-renungan #msEyebrow { color: color-mix(in srgb, var(--p-timerclock-color, var(--p-ink)) 55%, transparent); letter-spacing: 0.18em; }
  body.ms-renungan #msSubtitle { font-style: italic; opacity: 0.75; }
  body.ms-renungan #modeScreenView { animation-duration: 1.4s; }
  /* BARU (9 Sep 2026, sesi ke-9, permintaan operator "info waktunya foto
     bersama") -- eyebrow kuning ceria khas momen foto/kamera. */
  body.ms-foto #msEyebrow { color: #ffd23f; }
  body.ms-foto #msTitle { letter-spacing: 0.01em; }

  #timerClockTime {
    font-family: "Inter", Arial, sans-serif; font-weight: 800; letter-spacing: 0.02em;
    /* Sama seperti #stopwatchTime -- pakai --p-timer-scale sendiri (lihat
       catatan panjang di CSS #stopwatchTime di bawah), supaya bisa
       diperbesar sampai 10x TANPA ikut membesarkan ayat/teks lain.
       BARU (7 Sep 2026, permintaan operator): dikalikan JUGA dengan
       --p-scale (Ukuran Teks / tombol A-/A+ biasa) supaya A-/A+ ikut
       mengecilkan angka Jam Target kalau kepanjangan (mis. "01:00:10")
       -- sebelumnya A-/A+ TIDAK berpengaruh sama sekali ke sini karena
       cuma memutar --p-scale, sedangkan di sini cuma dengar --p-timer-
       scale. Terakhir dikalikan --p-timerclock-fit (lihat :root & catatan
       panjang fitTimerClockNumber_() di skrip bawah) sebagai JARING
       PENGAMAN OTOMATIS terakhir supaya bagaimanapun kombinasi slider di
       atas diatur, angka ini dijamin tetap muat & persis di tengah. */
    font-size: calc(clamp(56px, 13vw, 190px) * var(--p-timer-scale) * var(--p-scale) * var(--p-timerclock-fit, 1));
    color: var(--p-timerclock-color, var(--p-accent)); font-variant-numeric: tabular-nums;
    text-shadow: var(--p-timerclock-stroke, none);
  }
  #timerClockTime.done-text { color: #d9463a; } /* sudah 00:00:00 -- diam, warna merah menandakan sudah tercapai */
  #timerClockWrap.ps-standby #timerClockTime { animation: pStandbyBlink 1.3s ease-in-out infinite; }

  /* BARU (7 Sep 2026, permintaan operator) -- 9 posisi siap-pakai (lihat
     psTimerClockPosGrid, index.html & wireTimerClockPosition_(), js/
     presentation-studio.js) -- MENIMPA left/top/transform bawaan
     (tengah persis) di atas. Jarak dari tepi (5vh/4vw) SENGAJA tidak
     mepet 0 supaya tidak kepotong tepi layar proyektor asli (yang
     kadang sedikit "overscan").  ".tc-pos-center" TIDAK perlu aturan
     apa pun (kosongkan class-nya = otomatis jatuh ke default di atas). */
  #timerClockWrap.tc-pos-top { top: 6vh; left: 50%; transform: translate(-50%, 0); }
  #timerClockWrap.tc-pos-bottom { top: auto; bottom: 6vh; left: 50%; transform: translate(-50%, 0); }
  #timerClockWrap.tc-pos-left { top: 50%; left: 4vw; transform: translate(0, -50%); }
  #timerClockWrap.tc-pos-right { top: 50%; left: auto; right: 4vw; transform: translate(0, -50%); }
  #timerClockWrap.tc-pos-top-left { top: 6vh; left: 4vw; transform: none; }
  #timerClockWrap.tc-pos-top-right { top: 6vh; left: auto; right: 4vw; transform: none; }
  #timerClockWrap.tc-pos-bottom-left { top: auto; bottom: 6vh; left: 4vw; transform: none; }
  #timerClockWrap.tc-pos-bottom-right { top: auto; bottom: 6vh; left: auto; right: 4vw; transform: none; }

  /* BARU (7 Sep 2026, laporan operator) -- ikon bendera gambar utk teks
     Pengumuman/Teks Cepat. Lihat catatan panjang di flagifyAnnouncementText_()
     (skrip bawah) untuk KENAPA ini perlu (emoji bendera 🇮🇩 dkk. jadi cuma
     tulisan 2 huruf, mis. "ID", di Windows/Chrome -- font emoji Windows
     tidak menggambar bendera sungguhan utk sebagian besar negara, beda
     dari HP/Mac). Ukuran ikut ukuran huruf di sekitarnya (em) supaya
     otomatis ikut membesar/mengecil bersama teks pengumuman (termasuk
     ikut --p-scale lewat #text). */
  .ann-flag-ico {
    display: inline-block; width: 1.3em; height: 0.87em;
    vertical-align: -0.12em; border-radius: 2px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
  }
  .ann-flag-ico svg { display: block; width: 100%; height: 100%; }

  /* BARU (7 Sep 2026, permintaan operator) -- judul Pengumuman ("Judul"

  #effectsLayer { position: fixed; inset: 0; z-index: 70; pointer-events: none; overflow: hidden; }
  #effectsConfettiCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ms-effect-emoji {

    text-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  @keyframes msEffectRise {
    0% { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity: 0; }

    100% { transform: translate(var(--ms-effect-drift, 0px), -110vh) scale(1.15) rotate(var(--ms-effect-spin, 12deg)); opacity: 0; }
  }
  /* BARU (10 Sep 2026, permintaan operator "balon dari bawah") -- balon
     naik LEBIH LAMBAT & lebih besar dari reaksi emoji biasa (.ms-effect-
     emoji di atas, 3 detik) supaya terasa seperti balon sungguhan
     melayang, bukan sekadar emoji lewat cepat -- durasi 6.5 detik,
     ayunan kiri-kanan (wobble) lewat keyframe tengah tambahan (BEDA dari
     msEffectRise yang cuma titik awal/akhir), ease-out di ujung supaya
     melambat wajar mendekati puncak. Numpang #effectsLayer yang sama
     (fire-and-forget, dibuang sendiri lewat animationend). */
  .ms-effect-balloon {
    position: absolute; bottom: -80px; font-size: 54px; line-height: 1;
    animation: msBalloonRise 6.5s ease-out forwards;
    text-shadow: 0 3px 12px rgba(0,0,0,.3);
  }
  @keyframes msBalloonRise {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8% { opacity: 1; }
    30% { transform: translate(var(--ms-balloon-drift1, 40px), -35vh) rotate(var(--ms-balloon-spin1, 6deg)); }
    60% { transform: translate(var(--ms-balloon-drift2, -40px), -70vh) rotate(var(--ms-balloon-spin2, -6deg)); }
    92% { opacity: 1; }
    100% { transform: translate(var(--ms-balloon-drift1, 40px), -115vh) rotate(0deg); opacity: 0; }
  }
  /* BARU (9 Sep 2026, sesi ke-9, permintaan operator "seru nama Tuhan") --
     teks BESAR di TENGAH layar (BEDA dari .ms-effect-emoji di atas yang

     Total durasi ~2.6s, dibersihkan otomatis oleh playShout_() di skrip
     bawah (sama pola "tembak dan lupa" seperti efek lain). */
  .ms-shout-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: "Inter", Arial, sans-serif; font-weight: 900;
    font-size: clamp(40px, 9vw, 140px);

    text-shadow: 0 0 24px rgba(255, 210, 63, 0.85), 0 4px 18px rgba(0,0,0,.55);
    animation: msShoutPop 2.6s cubic-bezier(.2,.8,.3,1) forwards, msShoutGlow 0.7s ease-in-out infinite alternate;
  }
  @keyframes msShoutPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    10% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    18% { transform: translate(-50%, -50%) scale(1); }
    82% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.18); }
  }
  @keyframes msShoutGlow {
    from { text-shadow: 0 0 24px rgba(255, 210, 63, 0.85), 0 4px 18px rgba(0,0,0,.55); }
    to { text-shadow: 0 0 46px rgba(255, 210, 63, 1), 0 4px 18px rgba(0,0,0,.55); }

  // ------------------------------------------------------------
  function hideMagnify() {
    magnifierLens.style.display = "none";
    magnifierBadge.style.display = "none";
  }
  function showMagnify(xFrac, yFrac, percent) {
    if (!slideEl || slideEl.hidden || !slideEl.src) { hideMagnify(); return; }
    const rect = slideEl.getBoundingClientRect();
    if (!rect.width || !rect.height) { hideMagnify(); return; }
    const px = xFrac * window.innerWidth;
    const py = yFrac * window.innerHeight;
    let ix = (px - rect.left) / rect.width;
    let iy = (py - rect.top) / rect.height;
    ix = Math.min(1, Math.max(0, ix));
    iy = Math.min(1, Math.max(0, iy));
    const lensSize = magnifierLens.offsetWidth || 220;
    const zoom = Math.max(0.1, (Number(percent) || 100) / 100); // 10% s.d. 10000% -> faktor 0.1 s.d. 100
    const bgW = rect.width * zoom;
    const bgH = rect.height * zoom;
    magnifierLens.style.display = "block";
    magnifierLens.style.left = px + "px";
    magnifierLens.style.top = py + "px";
    magnifierLens.style.transform = "translate(-50%, -50%)";
    magnifierLens.style.backgroundImage = `url("${slideEl.src}")`;
    magnifierLens.style.backgroundSize = `${bgW}px ${bgH}px`;
    magnifierLens.style.backgroundPosition = `${-(ix * bgW - lensSize / 2)}px ${-(iy * bgH - lensSize / 2)}px`;
    magnifierBadge.style.display = "block";
    magnifierBadge.style.left = px + "px";
    magnifierBadge.style.top = (py - lensSize / 2 - 10) + "px";
    magnifierBadge.textContent = "🔍 " + Math.round(percent) + "%";
  }

  let effectsMuted_ = false;

  function getEffectsMasterGain_() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

  // BARU (10 Sep 2026, sesi ke-13) -- sambungkan SoundFX (js/soundfx.js)
  // ke AudioContext & GainNode YANG SUDAH ADA di atas, supaya efek
  // "🎉 Efek Panggung" yang diputar lewat SoundFX.play() TETAP ikut

  // di file ini -- tanpa ini, SoundFX akan membuat AudioContext-nya

  if (typeof SoundFX !== "undefined") {

      getAudioContext: () => (audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)()),
      getDestination: getEffectsMasterGain_,

  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.9);
      o.connect(g); g.connect(getEffectsMasterGain_());
      o.start(); o.stop(audioCtx.currentTime + 0.9);
    } catch (e) {}
  }

  // ------------------------------------------------------------
  let bellAudioEl = null;
  function ensureBellAudioEl_() {
    if (bellAudioEl) return bellAudioEl;

  // Mengenali link Google Drive dalam bentuk APA PUN (.../file/d/ID/view,
  // .../open?id=ID, dst -- sama pola pengenalan seperti driveFileIdFromUrl()
  // di js/media.js, disalin ringkas di sini karena Layar 2 tidak memuat
  // js/media.js) lalu mengubahnya jadi link unduh langsung yang BISA
  // dipasang sebagai src <audio>. Link non-Drive (mp3 publik lain) dipakai
  // apa adanya.
  function resolveBellAudioUrl_(rawUrl) {
    const s = String(rawUrl || "").trim();
    if (!s) return "";
    if (!/drive\.google\.com/.test(s)) return s;
    const m = s.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    return m ? ("https://drive.google.com/uc?export=download&id=" + m[1]) : s;
  }

  function findBellSound_(key) {
    const list = (window.CONFIG && Array.isArray(CONFIG.BELL_SOUNDS)) ? CONFIG.BELL_SOUNDS : [];
    return list.find((b) => b.key === key) || list[0] || null;
  }

  // Menghentikan bel yang SEDANG berbunyi (custom mp3) -- dipanggil saat:
  // (a) operator menekan tombol "🔇 Hentikan Bel" di Studio (pesan
  //     {type:"timer", action:"stopBell"}, lihat dispatcher di bawah),
  // (b) siapa pun mengklik DI MANA SAJA di layar Layar 2 ini (listener di
  //     bawah), atau (c) timer di-Stop/Ulang seperti biasa (stopTimer()).
  // Bunyi "denting" oscillator (beep()) TIDAK perlu dihentikan paksa --
  // durasinya sudah pendek (0.9 detik) & selesai sendiri.
  function stopBellSound() {
    if (bellAudioEl) {
      try { bellAudioEl.pause(); bellAudioEl.currentTime = 0; } catch (e) {}
    }
  }

  function ringBell(bellKey) {
    const sound = findBellSound_(bellKey);
    const url = resolveBellAudioUrl_(sound && sound.url);
    if (!url) { beep(); return; } // "Bel 1 (Bawaan)" / key tidak dikenal -> bunyi denting bawaan
    try {
      const a = ensureBellAudioEl_();
      a.src = url;
      a.currentTime = 0;
      const p = a.play();
      if (p && typeof p.catch === "function") {
        // Gagal diputar (mis. link Drive belum "Anyone with the link",
        // file kebesaran, atau belum ada interaksi klik sama sekali di
        // Layar 2 ini) -- tetap bunyikan denting bawaan supaya operator
        // TIDAK kehilangan tanda "timer sudah habis" sama sekali.
        p.catch(() => beep());

  }

  const effectsConfettiCanvas_ = document.getElementById("effectsConfettiCanvas");
  const CONFETTI_COLORS_ = ["#e2483d", "#3d8ee2", "#3de27a", "#e2c23d", "#a83de2", "#e2793d", "#3de2d4", "#e23d9e", "#ffffff"];
  let confettiRAF_ = null;
  function playConfetti_() {
    const canvas = effectsConfettiCanvas_;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = window.innerWidth, H = window.innerHeight;
    // 150 keping confetti jatuh dari atas, tiap keping punya kecepatan
    // jatuh, ayunan horizontal (wobble), & putaran sendiri-sendiri --
    // dibuat SEDERHANA (persegi kecil berwarna, bukan gambar/sprite)
    // supaya ringan dijalankan bahkan di laptop presentasi biasa.
    const pieces = Array.from({ length: 150 }, () => ({
      x: Math.random() * W,
      y: -20 - Math.random() * H * 0.5,
      w: 6 + Math.random() * 6,
      h: 10 + Math.random() * 8,
      color: CONFETTI_COLORS_[Math.floor(Math.random() * CONFETTI_COLORS_.length)],
      vy: 2.2 + Math.random() * 2.6,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.04 + Math.random() * 0.06,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 12,
    }));
    if (confettiRAF_) cancelAnimationFrame(confettiRAF_);
    const start = performance.now();
    function tick(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, W, H);
      pieces.forEach((p) => {
        p.y += p.vy;
        p.wobble += p.wobbleSpeed;
        p.rot += p.rotSpeed;
        const x = p.x + Math.sin(p.wobble) * 22;
        ctx.save();
        ctx.translate(x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      // Berhenti setelah 4.5 detik ATAU semua keping sudah lewat bawah
      // layar (mana yang lebih dulu) -- dibersihkan (clearRect) supaya
      // tidak meninggalkan bingkai kosong yang tetap menumpuk di depan.
      if (elapsed < 4500 && pieces.some((p) => p.y < H + 30)) {
        confettiRAF_ = requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, W, H);
        confettiRAF_ = null;
      }
    }
    confettiRAF_ = requestAnimationFrame(tick);
  }

  // Nada tunggal pendek, dipakai sebagai "bahan dasar" fanfare/ta-da di
  // bawah (beda dari beep() di atas yang frekuensinya tetap 880Hz --
  // di sini frekuensi & bentuk gelombang bisa diatur per panggilan).
  function playNote_(freq, when, dur, type, peakGain) {
    try {

  const wheelViewEl = document.getElementById("wheelView");

      const endRad = ((startDeg + segDeg) * Math.PI) / 180;

      ctx.arc(r, r, r - 4, startRad, endRad);

      ctx.fillStyle = WHEEL_COLORS_[i % WHEEL_COLORS_.length];

    // segmen supaya rapi.

    ctx.fillStyle = "#17110d";
    ctx.fill();
  }

  function spinWheel(data) {

    const winnerIndex = Math.max(0, Math.min(n - 1, data.winnerIndex || 0));
    // Titik jatuh sedikit ACAK di dalam segmen pemenang (±35% dari

    const EXTRA_SPINS = 6; // putaran penuh tambahan biar dramatis sebelum berhenti di segmen target
    const duration = 4200; // ms
    wheelRotation_ = wheelRotation_ + EXTRA_SPINS * 360 + forwardDelta;
    clearWheelTimers_();
    wheelWinnerBannerEl.textContent = "";
    requestAnimationFrame(() => {
      wheelCanvasEl.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.68, 0.18, 1)`;
      wheelCanvasEl.style.transform = `rotate(${wheelRotation_}deg)`;
    });
    // Bunyi "tik" dijadwalkan makin JARANG menjelang berhenti (mengikuti
    // easeOutCubic, sama kurva percepatan berhentinya dengan animasi
    // visual di atas) -- kesan roda melambat pelan-pelan sampai benar-
    // benar diam, bukan berhenti tiba-tiba.
    const numTicks = 46;
    for (let k = 1; k <= numTicks; k++) {
      const t = k / numTicks;
      const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
      const at = eased * (duration - 120);
      wheelTickTimeouts_.push(setTimeout(playWheelTick_, at));
    }
    wheelFinishTimeout_ = setTimeout(() => {
      wheelWinnerBannerEl.textContent = "🏆 " + wheelEntries_[winnerIndex];
      if (typeof SoundFX !== "undefined") SoundFX.play("tada");
      if (typeof playConfetti_ === "function") playConfetti_();
      if (window.opener) {
        try {
          window.opener.postMessage({ source: "bibleAppPresenter", type: "present_wheel_result", spinId: data.spinId, winnerIndex: winnerIndex }, location.origin);
        } catch (e) {}
      }
    }, duration + 60);
  }

  // Nada "tik" pendek & kering (noise singkat + denting tinggi tipis) --
  // pola SAMA seperti playNoiseBurst_()/playNote_() (🎉 Efek Panggung di
  // atas) -- 100% disintesis lewat Web Audio API, TIDAK ada file audio
  // sama sekali, jadi tetap 100% offline.
  function playWheelTick_() {
    if (typeof playNoiseBurst_ === "function") playNoiseBurst_(0, 0.045, 0.22);
    if (typeof playNote_ === "function") playNote_(1600, 0, 0.03, "square", 0.06);
