<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layar 2 — Tampilan Presentasi</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070c;
    color: #f5f2e8;
    font-family: "Literata", Georgia, serif;
    overflow: hidden;
  }
  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5vh 6vw;
    box-sizing: border-box;
  }
  #ref {
    font-family: "Inter", Arial, sans-serif;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #d8b45c;
    font-size: clamp(16px, 2.4vw, 30px);
    margin-bottom: clamp(14px, 2.4vh, 34px);
    opacity: 0.92;
  }
  #text {
    font-size: clamp(28px, 4.6vw, 68px);
    line-height: 1.35;
    max-width: 1200px;
    white-space: pre-wrap;
    text-shadow: 0 2px 18px rgba(0,0,0,0.5);
  }
  #idle {
    font-family: "Inter", Arial, sans-serif;
    color: #6b7280;
    font-size: clamp(16px, 2vw, 22px);
  }
  #stage.fade-in #text, #stage.fade-in #ref { animation: fadeUp .5s ease both; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  #closeHint {
    position: fixed; bottom: 14px; right: 18px;
    font-family: "Inter", Arial, sans-serif;
    font-size: 12px; color: #4b5563;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="ref" hidden></div>
    <div id="text"></div>
    <div id="idle">Menunggu tayangan dari layar utama…</div>
  </div>
  <div id="closeHint">Layar 2 — Mode Presentasi</div>

<script>
  const stageEl = document.getElementById("stage");
  const refEl = document.getElementById("ref");
  const textEl = document.getElementById("text");
  const idleEl = document.getElementById("idle");

  function render(data) {
    if (!data) return;
    if (data.type === "clear") {
      refEl.hidden = true; refEl.textContent = "";
      textEl.textContent = "";
      idleEl.hidden = false;
      return;
    }
    idleEl.hidden = true;
    stageEl.classList.remove("fade-in");
    // paksa reflow supaya animasi fade jalan lagi tiap konten berganti
    void stageEl.offsetWidth;
    if (data.type === "verse") {
      refEl.hidden = false;
      refEl.textContent = data.ref || "";
      textEl.textContent = data.text || "";
    } else if (data.type === "text") {
      refEl.hidden = true;
      refEl.textContent = "";
      textEl.textContent = data.text || "";
    }
    stageEl.classList.add("fade-in");
  }

  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const data = e.data || {};
    if (data.source !== "bibleAppPresenter") return;
    render(data.payload);
  });

  // Beri tahu jendela utama bahwa Layar 2 sudah siap menerima konten --
  // jendela utama akan mengirim ulang konten TERAKHIR begitu pesan ini
  // diterima (lihat js/presentation.js, handler "present_ready").
  if (window.opener) {
    try {
      window.opener.postMessage({ source: "bibleAppPresenter", type: "present_ready" }, location.origin);
    } catch (e) { /* beda origin / opener tertutup -- diamkan */ }
  }
</script>
</body>
</html>
