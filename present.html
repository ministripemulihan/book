  // ------------------------------------------------------------
  // BARU (27 Agu 2026) -- ⏱️ Stopwatch (hitung MAJU dari 0, dikendalikan
  // dari Layar 1/Controller lewat #psStopwatchStartBtn dkk di
  // js/presentation-studio.js & #presentStopwatchStartBtn dkk di
  // js/presentation.js -- lihat komentar panjang di kedua file itu).
  // Pola SAMA seperti Timer (hitung mundur) di atas -- BEDANYA cuma di
  // arah hitungannya & tidak ada cincin progres (tidak ada "target").
  //   - `baseStartAt` = kapan (epoch ms) stopwatch ini SEHARUSNYA mulai
  //     dari 0 kalau berjalan TERUS TANPA JEDA -- dihitung ulang di sisi
  //     Controller tiap kali "▶️ Mulai" ditekan (baik pertama kali
  //     maupun melanjutkan dari jeda): `Date.now() - sudahBerjalanMs`.
  //     Elapsed SEKARANG = `Date.now() - baseStartAt`, cukup 1 angka
  //     ini untuk tetap akurat lewat postMessage tanpa perlu kirim
  //     "centang" tiap detik.
  //   - `action:"stop"` (jeda): TIDAK mengirim elapsed apa pun -- Layar 2
  //     cukup BERHENTI meng-update tampilan (nilai TERAKHIR yang sempat
  //     dihitung otomatis tetap terlihat, beku di situ) sampai
  //     "start" berikutnya datang.
  //   - `action:"reset"`: sembunyikan & kembali ke 00:00.
  // ------------------------------------------------------------
  let stopwatchState = null; // { baseStartAt, label }
  let stopwatchInterval = null;
  function fmtStopwatch(totalSec) {
    const s = Math.max(0, Math.floor(totalSec));
    const hh = Math.floor(s / 3600);
    const mm = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    const pad2 = (n) => String(n).padStart(2, "0");
    return hh > 0 ? `${hh}:${pad2(mm)}:${pad2(ss)}` : `${pad2(mm)}:${pad2(ss)}`;
  }
  function tickStopwatch() {
    if (!stopwatchState) return;
    const elapsed = (Date.now() - stopwatchState.baseStartAt) / 1000;
    stopwatchTimeEl.textContent = fmtStopwatch(elapsed);
  }
  function showStopwatch(data) {
    stopTimer(false); // Timer & Stopwatch tidak boleh berbarengan (lihat catatan di atas)
    stopTimerClock(false); // BARU (7 Sep 2026)
    stopLocalVideo(false); // BARU (7 Sep 2026) -- ikut 🎬 Video Lokal juga
    stopModeScreen(false); // BARU (9 Sep 2026)
    stopMap(false); // BARU (9 Sep 2026)
    hideMagnify();
    stopwatchState = { baseStartAt: data.baseStartAt, label: data.label || "" };
    stopwatchLabelEl.textContent = stopwatchState.label;
    // BARU (7 Sep 2026) -- beneran Mulai/Lanjut: lepas status standby/
    // dijeda (penanda/#stopwatchLapBadge SENGAJA TIDAK dikosongkan di sini
    // -- kalau ini "Lanjut" dari jeda, penanda sebelumnya tetap relevan).
    stopwatchWrap.classList.remove("ps-standby", "ps-paused");
    if (stopwatchStatusBadgeEl) stopwatchStatusBadgeEl.textContent = "";
    stopwatchWrap.hidden = false;
    idleEl.hidden = true;
    refEl.hidden = true; textEl.textContent = ""; logoEl.hidden = true; slideEl.hidden = true;
    if (!ytEl.hidden) { ytEl.hidden = true; ytEl.src = ""; }
    tickStopwatch();
    if (stopwatchInterval) clearInterval(stopwatchInterval);
    stopwatchInterval = setInterval(tickStopwatch, 250);
  }
  function pauseStopwatchDisplay() {
    // "Jeda" -- BEDA dari stopStopwatch(): overlay & label TETAP tampil,
    // cuma centangnya berhenti (angka terakhir tetap beku di layar),
    // supaya operator/jemaat masih bisa melihat berapa lama sesi
    // berjalan sejauh ini walau sedang dijeda.
    // BARU (7 Sep 2026) -- tambah badge "⏸ Jeda", sama seperti Timer.
    if (stopwatchInterval) { clearInterval(stopwatchInterval); stopwatchInterval = null; }
    stopwatchWrap.classList.add("ps-paused");
    if (stopwatchStatusBadgeEl) stopwatchStatusBadgeEl.textContent = "⏸ Jeda";
  }

  // BARU (7 Sep 2026, permintaan operator) -- "👁️ Tampilkan ke Layar 2"
  // untuk Stopwatch, pola SAMA persis dengan showTimerStandby() di atas:
  // "00:00" berkedip + badge kuning "MULAI", SEBELUM "▶️ Mulai" ditekan.
  function showStopwatchStandby(data) {
    stopTimer(false);
    stopTimerClock(false); // BARU (7 Sep 2026)
    stopLocalVideo(false); // BARU (7 Sep 2026) -- ikut 🎬 Video Lokal juga
    stopModeScreen(false); // BARU (9 Sep 2026)
    stopMap(false); // BARU (9 Sep 2026)
    if (stopwatchInterval) { clearInterval(stopwatchInterval); stopwatchInterval = null; }
    stopwatchState = null;
    hideMagnify();
    stopwatchLabelEl.textContent = data.label || "";
    stopwatchTimeEl.textContent = "00:00";
    stopwatchWrap.classList.add("ps-standby");
    stopwatchWrap.classList.remove("ps-paused", "ps-has-lap"); // sesi baru -- penanda lama (kalau ada) tidak relevan lagi
    if (stopwatchLapBadgeEl) stopwatchLapBadgeEl.textContent = "";
    if (stopwatchStatusBadgeEl) stopwatchStatusBadgeEl.textContent = "Mulai";
    stopwatchWrap.hidden = false;
    idleEl.hidden = true;
    refEl.hidden = true; textEl.textContent = ""; logoEl.hidden = true; slideEl.hidden = true;
    if (!ytEl.hidden) { ytEl.hidden = true; ytEl.src = ""; }
  }

  // BARU (7 Sep 2026, permintaan operator) -- "🚩 Penanda" (lap) SEKARANG
  // juga tampil sebentar di Layar 2 sebagai badge kecil di bawah angka
  // stopwatch (dikirim dari lap(), js/presentation-studio.js), supaya
  // jemaat/tim juga bisa melihat penanda terjadi -- TETAP tampil sampai
  // penanda berikutnya, atau sampai stopwatch di-reset/standby lagi.
  function showStopwatchLap_(data) {
    if (!stopwatchLapBadgeEl) return;
    stopwatchLapBadgeEl.textContent = "🚩 Penanda " + data.n + " • +" + fmtStopwatch(data.splitSec || 0);
    stopwatchWrap.classList.remove("ps-has-lap");
    void stopwatchWrap.offsetWidth; // restart animasi fadeUp walau class-nya sudah ada dari penanda sebelumnya
    stopwatchWrap.classList.add("ps-has-lap");
  }

  function koorColorForBg(hex) {
    const h = String(hex || "").replace("#", "");
    if (h.length !== 6) return "#ffd84a";
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const luma = 0.299 * r + 0.587 * g + 0.114 * b; // 0 (gelap) - 255 (terang)
    return luma > 170 ? "#8a6d00" : "#ffd84a";
  }
  // ------------------------------------------------------------
  // BARU (28 Agu 2026) -- 🎥 KAMERA LATAR. Menyalakan kamera PERANGKAT
  // YANG MEMBUKA JENDELA INI (laptop/HP yang tersambung ke proyektor)
  // sebagai latar belakang hidup di belakang ayat/kidung/pengumuman --
  // lihat tab "🎥 Kamera" di Studio (js/presentation-studio.js,
  // wireCamera()) untuk kontrolnya. Izin kamera browser (getUserMedia)
  // SENGAJA diminta di SINI (jendela Layar 2), bukan di jendela Studio,
  // supaya kameranya benar-benar yang terpasang & menghadap ke arah
  // yang dipakai di lokasi acara -- bukan kamera laptop operator yang
  // sedang mengetik di jendela lain.
  //
  // Teks (#ref/#text) diberi GARIS TEPI (outline) memakai teknik
  // "text-shadow melingkar" (buildOutlineShadow() -- beberapa lapis
  // text-shadow kecil ke segala arah membentuk garis tepi) -- dipilih
  // ketimbang properti `-webkit-text-stroke` karena text-shadow
  // didukung SEMUA browser tanpa perlu prefiks & tidak berisiko garis
  // tepinya "memakan" isi huruf (masalah umum -webkit-text-stroke kalau
  // urutan lukis stroke-di-atas-fill tidak didukung `paint-order` di
  // browser tertentu). --p-outline-shadow & --p-cam-ink adalah CSS
  // custom property yang HANYA diisi selama kamera aktif (lihat
  // applyCamTextStyle() di bawah) -- kosong/tidak diset = var() di
  // #ref/#text (lihat <style> di atas) otomatis jatuh ke tampilan lama
  // (warna tema biasa, tanpa outline), jadi TIDAK mengubah tampilan
  // sama sekali selama fitur ini tidak dipakai.
  // ------------------------------------------------------------
  let camStream = null;
  let camActive = false;
  let camFacing = null;
  let camMirror = false;
  // BARU (28 Agu 2026) -- 🖼️ Latar Gambar (lihat catatan #imgBg di
  // <style> & applyBgImagePayload() di bawah).
  let imgBgActive = false;
  // BARU (8 Sep 2026, permintaan operator "video ada subtitle-nya") --
  // status toggle "📝 Ayat/Kidung/Pengumuman TETAP tampil di atas video"
  // (theme.videoTextOverlay, lihat applyTheme() di bawah) -- dibaca oleh
  // showMain() kind "youtube" & showLocalVideo() supaya #text/#ref TIDAK
  // dikosongkan/disembunyikan lagi saat video mulai diputar. MATI
  // (false) secara bawaan = perilaku lama tidak berubah.
  let videoTextOverlayOn = false;

  function buildOutlineShadow(color, widthPx) {
    const w = Math.max(0.5, Number(widthPx) || 3);
    const STEPS = 16; // cukup rapat supaya garis tepinya terlihat mulus melingkar, bukan segi-N kasar
    const parts = [];
    for (let i = 0; i < STEPS; i++) {
      const angle = (i / STEPS) * Math.PI * 2;
      parts.push(`${(Math.cos(angle) * w).toFixed(2)}px ${(Math.sin(angle) * w).toFixed(2)}px 0 ${color}`);
    }
    return parts.join(", ");
  }

  // `mode`: "white-black" (tulisan putih, border hitam -- cocok utk
  // latar yang cenderung TERANG) | "black-white" (tulisan hitam,
  // border putih -- cocok utk latar yang cenderung GELAP) | "custom"
  // (BARU 28 Agu 2026 -- warna tulisan & border BEBAS dipilih operator
  // lewat color picker, dioper lewat `ink`/`outline`, bukan cuma 2
  // pilihan hitam/putih) | "none"/kosong (matikan, kembali ke
  // tampilan tema biasa). Dipakai baik untuk 🎥 Kamera maupun 🖼️
  // Gambar Latar -- keduanya sama-sama butuh tulisan yang tetap
  // terbaca di atas latar yang tidak polos.
  function applyCamTextStyle(mode, widthPx, ink, outline) {
    const root = document.documentElement.style;
    if (!mode || mode === "none") {
      root.removeProperty("--p-outline-shadow");
      root.removeProperty("--p-cam-ink");
      return;
    }
    let outlineColor, fillColor;
    if (mode === "custom") {
      fillColor = ink || "#ffffff";
      outlineColor = outline || "#000000";
    } else {
      outlineColor = mode === "black-white" ? "#ffffff" : "#000000";
      fillColor = mode === "black-white" ? "#000000" : "#ffffff";
    }
    root.setProperty("--p-outline-shadow", buildOutlineShadow(outlineColor, widthPx));
    root.setProperty("--p-cam-ink", fillColor);
  }

  // Latar (kamera ATAU gambar) cuma masuk akal di BELAKANG teks (ayat/
  // teks bebas/kidung) -- disembunyikan (opacity 0, stream/gambar
  // TETAP terpasang, tidak dimatikan/dibuang) begitu tayangan pindah
  // ke Hitam/Logo/Slide/YouTube, yang masing-masing sudah punya
  // kontennya sendiri & tidak butuh (atau malah terganggu oleh) latar
  // di baliknya. Muncul lagi otomatis begitu kembali ke ayat/teks/
  // kidung -- operator tidak perlu menyalakan-matikan latar manual
  // tiap ganti jenis tayangan.
  function setCamVisibleForKind(kind) {
    if (!camActive && !imgBgActive) return;
    const show = kind === "verse" || kind === "text" || kind === "kidung";
    if (camActive) camBgEl.style.opacity = show ? "1" : "0";
    if (imgBgActive) imgBgEl.style.opacity = show ? "1" : "0";
  }

  // BARU (28 Agu 2026) -- 🖼️ Latar Gambar: kebalikan dari #camBg tidak
  // perlu izin browser (getUserMedia) sama sekali -- cukup pasang
  // `src` gambar (data-URL, dikirim apa adanya dari Studio, sama pola
  // seperti "slide" di showMain()) begitu diterima. Kamera & Gambar
  // Latar SALING MENIADAKAN (satu aktif, yang lain otomatis mati) --
  // Studio yang menjaga aturan ini (lihat applyLatarSource() di
  // js/presentation-studio.js), di sini cukup taati apa yang dikirim.
  function applyBgImagePayload(data) {
    if (data.on && data.url) {
      imgBgEl.src = data.url;
      imgBgEl.hidden = false;
      imgBgEl.style.opacity = "1";
      imgBgActive = true;
      if (camActive) stopCamera(); // pastikan tidak dua-duanya aktif sekaligus
    } else {
      imgBgActive = false;
      imgBgEl.style.opacity = "0";
      imgBgEl.hidden = true;
    }
    updateLatarDimClass();
  }

  function reportCameraStatus(on, error) {
    if (!window.opener) return;
    try {
      window.opener.postMessage({ source: "bibleAppPresenter", type: "present_camera_status", on, error: error || null }, location.origin);
    } catch (e) { /* beda origin / opener tertutup -- diamkan */ }
  }

  // BARU (28 Agu 2026) -- dipanggil di beberapa tempat (startCamera,
  // stopCamera, applyBgImagePayload) -- satu tempat untuk menjaga
  // kelas "cam-active" (dim overlay) menyala kalau SALAH SATU dari
  // kamera/gambar latar aktif, mati kalau dua-duanya mati.
  function updateLatarDimClass() {
    document.body.classList.toggle("cam-active", camActive || imgBgActive);
  }

  async function startCamera(facingMode, mirror) {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Browser ini tidak mendukung akses kamera.");
      }
      if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode || "user" }, audio: false });
      // Kamera & Gambar Latar saling meniadakan (lihat catatan
      // applyBgImagePayload()) -- menyalakan kamera otomatis mematikan
      // gambar latar kalau sedang aktif.
      if (imgBgActive) { imgBgActive = false; imgBgEl.hidden = true; imgBgEl.style.opacity = "0"; }
      camBgEl.srcObject = camStream;
      camActive = true;
      camFacing = facingMode || "user";
      camMirror = !!mirror;
      camBgEl.style.transform = camMirror ? "scaleX(-1)" : "none";
      camBgEl.style.opacity = "1";
      camBgEl.hidden = false;
      updateLatarDimClass();
      reportCameraStatus(true, null);
    } catch (e) {
      camActive = false;
      camBgEl.hidden = true;
      updateLatarDimClass();
      // Pesan error asli browser (mis. "Permission denied", "Requested
      // device not found") diteruskan apa adanya ke Studio supaya
      // operator tahu persis kenapa (izin ditolak / tidak ada kamera /
      // dsb), bukan cuma "gagal" tanpa keterangan.
      reportCameraStatus(false, String((e && e.message) || e));
    }
  }

  function stopCamera() {
    if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
    camActive = false;
    camBgEl.hidden = true;
    camBgEl.srcObject = null;
    updateLatarDimClass();
    reportCameraStatus(false, null);
  }

  // Dipanggil dari render() saat menerima payload {type:"camera", ...}.
  // Stream kamera HANYA dinyalakan ulang (startCamera) kalau memang
  // belum aktif atau arah kameranya (`facingMode`) berubah -- supaya
  // pengaturan lain (gaya tulisan dsb, sekarang dikirim terpisah lewat
  // {type:"latartext"}) TIDAK memicu video berkedip/diminta ulang
  // izinnya setiap kali.
  function applyCameraPayload(data) {
    if (data.on) {
      const needsRestart = !camActive || camFacing !== (data.facingMode || "user");
      if (needsRestart) {
        startCamera(data.facingMode, data.mirror);
      } else if (camMirror !== !!data.mirror) {
        camMirror = !!data.mirror;
        camBgEl.style.transform = camMirror ? "scaleX(-1)" : "none";
      }
    } else if (camActive) {
      stopCamera();
    }
  }

  function applyTheme(theme) {
    if (!theme) return;
    const root = document.documentElement.style;
    if (theme.font) root.setProperty("--p-font", theme.font);
    if (theme.bgColor) {
      root.setProperty("--p-bg", theme.bgColor);
      root.setProperty("--p-koor", koorColorForBg(theme.bgColor));
    }
    // Perbaikan utama: dulu warna tulisan (--p-ink) TIDAK PERNAH ikut
    // berubah saat ganti tema -- jadi tema latar terang (Terang/Klasik
    // Sepia) membuat tulisan (krem-terang bawaan) nyaris tak kelihatan
    // di atas latar yang juga terang. Sekarang ink dikirim & diterapkan
    // bersamaan dengan bgColor supaya kontrasnya selalu terjaga.
    if (theme.ink) root.setProperty("--p-ink", theme.ink);
    if (theme.scale) root.setProperty("--p-scale", theme.scale);
    if (theme.lineHeight) root.setProperty("--p-line-height", theme.lineHeight);
    // BARU (28 Agu 2026) -- lihat catatan --p-content-scale di <style> di atas.
    if (theme.contentScale) root.setProperty("--p-content-scale", theme.contentScale);
    // BARU (4 Sep 2026) -- toggle "Tebal" (Bold): beda dari properti lain
    // di atas (yang pakai `if (theme.x)`, dilewati kalau falsy/kosong),

  function applyTicker(barEl, textEl2, data) {
    if (!data.show || !data.text) { barEl.hidden = true; return; }
    barEl.hidden = false;
    textEl2.textContent = data.text + "     ";
    // BARU (7 Sep 2026 v3, permintaan operator) -- A+/A- khusus ukuran
    // huruf pesan (--p-msg-scale, lihat CSS .ticker-bar .ticker-inner).
    document.documentElement.style.setProperty("--p-msg-scale", String(Number(data.scale) || 1));
    // PERBAIKAN (laporan operator 28 Agu 2026) -- SEBELUMNYA scroll/diam
    // ditebak SENDIRI dari panjang teks (>40 karakter = geser, kalau
    // tidak = selalu diam di tengah) -- checkbox "▶️ Berjalan" di Studio
    // (js/presentation-studio.js, wireMessage()) sama sekali tidak
    // berpengaruh. SEKARANG: kalau Studio secara EKSPLISIT mengirim
    // `data.scroll` (true/false, sesuai centang checkbox itu), itu yang
    // dipakai apa adanya -- pesan PENDEK sekalipun (mis. "sekarang
    // waktunya jalan") akan tetap bergeser kanan->kiri kalau operator
    // memang mencentang "Berjalan". Auto-tebak dari panjang teks HANYA
    // dipakai sebagai fallback kalau `data.scroll` tidak dikirim sama
    // sekali (`undefined` -- untuk jaga-jaga kalau ada pemanggil lain di
    // masa depan yang belum mengirim field ini).
    const scrolling = typeof data.scroll === "boolean" ? data.scroll : (data.text.length > 40);
    barEl.classList.toggle("scrolling", scrolling);
    barEl.classList.toggle("static", !scrolling);
    // Warna teks -- SEBELUMNYA `msgColor` di Studio tersimpan tapi tidak
    // pernah dikirim sama sekali, jadi pilihan warna di palet "Warna
    // Teks" tidak berpengaruh apa pun (selalu putih bawaan CSS). Sekarang
    // dipakai kalau dikirim, jatuh balik ke putih kalau tidak ada.
    barEl.style.color = data.color || "#ffffff";
    // BARU (7 Sep 2026 v2, permintaan operator) -- mode "pulse"
    // (Berdenyut): tetap DIAM di tempat (bukan scrolling), cuma ukuran
    // teksnya yang berdenyut 100% <-> 150% berulang. Ditangani TERPISAH
    // dari `scrolling` (yang cuma tahu true/false) supaya "scroll" tetap
    // false (posisi tidak bergeser) sementara animasi denyut tetap jalan.
    const pulsing = data.mode === "pulse";
    textEl2.classList.toggle("pulsing", pulsing);
    barEl.classList.toggle("pulse-mode", pulsing);
    if (pulsing) {
      const secs = Math.max(0.3, Number(data.pulseSeconds) || 2);
      textEl2.style.animationDuration = secs + "s";
    } else if (!scrolling) {
      // (kalau bukan pulse & bukan scrolling, animationDuration diberesin
      // di cabang `else` bawah bersama urusan `parentElement`.)
    }
    // BARU (7 Sep 2026 v2, permintaan operator) -- checklist border warna
    // di sekeliling LATAR/BACKGROUND bar (Tanpa/Merah/Putih/Biru), beda
    // dari stroke teks di atas. Kosong ("") berarti balik ke border tipis
    // emas bawaan (lihat #wartaBar/#footBar/#msgMidBar di <style>).
    if (data.borderColor) {
      const bw = Number(data.borderWidth) || 4;
      barEl.style.border = bw + "px solid " + data.borderColor;
      // Timpa border-top/border-bottom bawaan (#wartaBar/#footBar) yang
      // sebelumnya cuma diset di 1 sisi, supaya border baru ini kelihatan
      // penuh di keempat sisi.
      barEl.style.borderTop = bw + "px solid " + data.borderColor;
      barEl.style.borderBottom = bw + "px solid " + data.borderColor;
    } else {
      barEl.style.border = "";
      barEl.style.borderTop = "";
      barEl.style.borderBottom = "";
    }
    // BARU (8 Sep 2026, permintaan operator) -- LATAR/BACKGROUND bar
    // pesan bisa diwarnai PENUH SOLID (mis. Merah penuh untuk pesan
    // darurat/penting), beda dari `borderColor` di atas yang cuma garis
    // tepi tipis. Kosong ("") berarti balik ke latar gelap solid bawaan
    // (rgba(6,6,10,0.92), lihat .ticker-bar di <style>) -- lihat
    // psMsgBgColorRow (index.html) & wireMessage() (js/presentation-
    // studio.js) untuk kontrolnya.
    barEl.style.background = data.bg || "";
    // BARU (7 Sep 2026, permintaan operator) -- jenis huruf (font) &
    // stroke/kontur tebal di sekeliling huruf (mis. isi Merah + kontur
    // Putih tebal supaya tetap kelihatan jelas di latar apa pun).
    // `-webkit-text-stroke` didukung Chrome/Edge/Safari (mesin dominan

    // SEKALIGUS sebagai cadangan di browser yang tidak mendukung
    // text-stroke, supaya kontur tetap kelihatan di mana pun.
    textEl2.style.fontFamily = data.fontFamily || "";
    if (data.stroke) {
      const w = Number(data.strokeWidth) || 2;
      textEl2.style.webkitTextStroke = w + "px " + data.stroke;
      textEl2.style.paintOrder = "stroke fill";
      const s = data.stroke;
      textEl2.style.textShadow =
        `-${w}px -${w}px 0 ${s}, ${w}px -${w}px 0 ${s}, -${w}px ${w}px 0 ${s}, ${w}px ${w}px 0 ${s}, ` +
        `0 -${w}px 0 ${s}, 0 ${w}px 0 ${s}, -${w}px 0 0 ${s}, ${w}px 0 0 ${s}`;
    } else {
      textEl2.style.webkitTextStroke = "";
      textEl2.style.paintOrder = "";
      textEl2.style.textShadow = "";
    }
    if (scrolling) {
      // PERBAIKAN (7 Sep 2026 v3) -- SEBELUMNYA durasi dipasang di
      // `textEl2.parentElement` (elemen BAR, animasinya cuma "fadeUp"
      // masuk-layar) -- SEKARANG benar dipasang di `textEl2` sendiri
      // (.ticker-inner), tempat animasi "tickerScroll" yang sesungguhnya
      // berjalan (class "scrolling" di atas). Lihat catatan panjang di
      // <style> (".ticker-bar.scrolling .ticker-inner") untuk kronologi
      // lengkap bug ini.
      //
      // BARU (7 Sep 2026 v3, permintaan operator "terlalu cepat") --
      // kecepatan sekarang bisa dipilih dari Studio: `data.scrollBaseSec`
      // = lama MINIMAL 1 putaran penuh dalam detik (Lambat=18, Sedang=12
      // [bawaan, naik dari 8 sebelumnya], Cepat=7 -- lihat #psMsgSpeedRow
      // & wireMessage() di js/presentation-studio.js). Teks yang lebih
      // panjang dari itu otomatis dapat waktu LEBIH (supaya tetap ~6
      // huruf/detik, cukup untuk dibaca), bukan makin cepat.
      const baseSec = Math.max(4, Number(data.scrollBaseSec) || 12);
      const secs = Math.max(baseSec, data.text.length / 6);
      textEl2.style.animationDuration = secs + "s";
    } else {
      textEl2.style.animationDuration = "";
    }
  }

  // BARU (4 Sep 2026, v7) -- PERBAIKAN BUG nyata dilaporkan operator lewat
  // screenshot: link pendek resmi SoundCloud (mis. "on.soundcloud.com/xxx")
  // ditempel APA ADANYA ke "https://w.soundcloud.com/player/?url=..." dan
  // widget-nya menolak dengan pesan "You have not provided a valid
  // SoundCloud URL" -- ternyata endpoint widget publik (w.soundcloud.com)
  // TIDAK menerima pola domain "on.soundcloud.com" sebagai parameter "url"
  // walau endpoint API resmi lain (/resolve) sudah mendukungnya sejak 2023
  // (2 sistem beda di sisi SoundCloud, bukan bug di kode ini).
  // Perbaikan: sebelum membangun src widget, tanya dulu endpoint oEmbed
  // publik SoundCloud (https://soundcloud.com/oembed) -- endpoint ini
  // didokumentasikan resmi "menerima URL apa pun yang menunjuk ke
  // track/set/user" dan mendukung CORS (bisa dipanggil `fetch()` langsung
  // dari sini) -- hasilnya berupa kode <iframe> siap pakai yang SUDAH
  // memakai link asli/kanonik (bukan link pendek), lalu kita ambil ulang
  // parameter "url" dari situ untuk dipasang lagi ke widget dengan
  // parameter tampilan kita sendiri (warna, auto_play, dst). Kalau
  // permintaan oEmbed ini gagal (mis. jaringan mati/offline saat acara),
  // FALLBACK ke cara lama (link ditempel apa adanya) supaya link
  // "soundcloud.com/artis/judul" biasa yang SUDAH bekerja sebelumnya tetap
  // jalan seperti biasa, tidak ikut rusak oleh perbaikan ini.
  async function resolveSoundCloudSrc(trackUrl, autoplay) {
    const paramsTail = "&auto_play=" + (autoplay === false ? "false" : "true") +
      "&color=%23d8b45c&show_user=true&visual=false&buying=false&sharing=false&download=false";
    try {
      const oembedUrl = "https://soundcloud.com/oembed?format=json&iframe=true&url=" + encodeURIComponent(trackUrl);
      const res = await fetch(oembedUrl);
      if (res.ok) {
        const json = await res.json();
        const html = (json && json.html) || "";
        const srcMatch = /src="([^"]+)"/.exec(html);
        if (srcMatch && srcMatch[1]) {
          const urlParamMatch = /[?&]url=([^&]+)/.exec(srcMatch[1]);
          if (urlParamMatch && urlParamMatch[1]) {
            return "https://w.soundcloud.com/player/?url=" + urlParamMatch[1] + paramsTail;
          }
          return srcMatch[1]; // fallback: pakai src dari oEmbed apa adanya kalau pola "url=" tidak ketemu
        }
      }
    } catch (err) {
      // Jaringan gagal / oEmbed tidak bisa dihubungi -- lanjut ke fallback di bawah, JANGAN throw
    }
    return "https://w.soundcloud.com/player/?url=" + encodeURIComponent(trackUrl) + paramsTail;
  }

  function flagifyAnnouncementText_(raw) {
    // Escape dulu (sama seperti escKidung() di bawah) supaya teks bebas

    const esc = String(raw || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    return esc.replace(/(?:\uD83C[\uDDE6-\uDDFF]){2}/g, (m) => {

      // supaya tidak ada spasi ganda/baris aneh.
      let kidungSub = "";
      if (data.pengarang && String(data.pengarang).trim()) kidungSub += String(data.pengarang).trim();
      if (data.birama && String(data.birama).trim()) kidungSub += (kidungSub ? " " : "") + String(data.birama).trim();
      if (data.jumlahBait) kidungSub += (kidungSub ? " " : "") + "(" + data.jumlahBait + " Bait)";
      refSubEl.hidden = !kidungSub;
      refSubEl.textContent = kidungSub;
      const escKidung = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const baitHtml = (data.bait || [])
        .map((b) => `<div class="kidung-bait-line">${escKidung((b.noBait ? b.noBait + ". " : "") + (b.teks || "")).replace(/\n/g, "<br>")}</div>`)
        .join('<div class="kidung-line-gap">&nbsp;</div>');
      const koorHtml = data.koorTeks
        ? `<div class="kidung-line-gap">&nbsp;</div><div class="kidung-koor-line"><span class="kidung-koor-label">Koor:</span><br>${escKidung(data.koorTeks).replace(/\n/g, "<br>")}</div>`

  function render(data) {

    // BARU (7 Sep 2026, permintaan operator) -- 🎬 Video Lokal (MP4),
    // lihat catatan panjang di HTML <video id="localVideoEl"> &

    if (data.type === "localvideo") {

    // BARU (8 Sep 2026, permintaan operator "shortcut bel 1/2/3") --

    // 🎥 Kamera ATAU 🖼️ Gambar Latar aktif -- dipisah dari payload

    if (data.type === "latartext") { applyCamTextStyle(data.mode, data.widthPx, data.ink, data.outline); return; }

      // BARU (4 Sep 2026 v2) -- "seek": lompat ke detik `data.arg` (dikirim

      // BARU (10 Sep 2026, sesi ke-11, permintaan operator "cara enable/

      // lewat perintah resmi "loadModule"/"unloadModule" (bagian dari

    if (data.type === "sc_control") {

    if (data.type === "yt_queue") {

    if (data.type === "yt_bg") {

      if (!ytBgEl.src || !ytBgEl.contentWindow) return;

      if (cmd) ytBgEl.contentWindow.postMessage(JSON.stringify({ event: "command", func: cmd, args: [] }), "*");
      return;

    if (data.type === "yt_bg_clear") {
      ytBgEl.src = "";
      return;
    }
    if (data.type === "pen") {
      if (data.clear) {
        penStrokeHistory = [];
        penCanvas.width = window.innerWidth; penCanvas.height = window.innerHeight;
        penCtx.clearRect(0, 0, penCanvas.width, penCanvas.height);
        penCanvas.style.display = "none";
        return;
      }
      penCanvas.style.display = "block";
      if (data.stroke && data.stroke.length > 1) {
        // Simpan koordinat ASLI (pecahan 0..1, bukan px) supaya bisa
        // digambar ulang secara akurat kalau jendela di-resize/di-split --
        // sebelumnya canvas cuma di-resize (otomatis menghapus isi) lalu
        // cuma segmen BARU yang digambar, jadi coretan lama hilang/
        // terlihat terpotong saat jendela ditarik-ubah ukurannya.
        // BARU (27 Agu 2026) -- ukuran coretan dikirim dari Studio lewat
        // `data.size` (px), disimpan juga di riwayat supaya redraw saat
        // resize tetap setebal aslinya (bukan selalu 4px seperti dulu).
        penStrokeHistory.push({ pts: data.stroke, color: data.color || "#ff3b30", size: data.size || 4 });
        if (penCanvas.width !== window.innerWidth || penCanvas.height !== window.innerHeight) {

          drawPenSegment(data.stroke, data.color || "#ff3b30", data.size || 4);
        }
      }
      return;
    }

  // Riwayat semua segmen coretan Pen (koordinat pecahan 0..1) supaya bisa
  // digambar ulang penuh & akurat tiap kali ukuran jendela berubah.
  let penStrokeHistory = [];
  function drawPenSegment(stroke, color, size) {
    penCtx.strokeStyle = color;
    penCtx.lineWidth = size || 4; penCtx.lineCap = "round"; penCtx.lineJoin = "round";
    penCtx.beginPath();
    stroke.forEach((pt, i) => {
      const x = pt.x * penCanvas.width, y = pt.y * penCanvas.height;
      if (i === 0) penCtx.moveTo(x, y); else penCtx.lineTo(x, y);
    });
    penCtx.stroke();
  }
  function redrawAllPenStrokes() {
    penCanvas.width = window.innerWidth; penCanvas.height = window.innerHeight;
    penCtx.clearRect(0, 0, penCanvas.width, penCanvas.height);
    penStrokeHistory.forEach((s) => drawPenSegment(s.pts, s.color, s.size));
  }

  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const data = e.data || {};
    if (data.source !== "bibleAppPresenter") return;
    render(data.payload);
  });

  // BARU (28 Agu 2026) -- deteksi video YouTube utama (#ytView) SELESAI
  // (ended) lewat "raw" postMessage bawaan pemutar YouTube sendiri
  // (bukan lewat API resmi YT.Player, supaya tidak perlu memuat skrip
  // tambahan cuma untuk 1 layar ini) -- lihat "enablejsapi=1" di
  // buildYoutubeEmbedUrl() (js/presentation-studio.js). Player
  // otomatis mengirim { event:"infoDelivery", info:{ playerState } }
  // setelah kita kirim { event:"listening" } sekali ke dalamnya;
  // playerState 0 = video berakhir. Berdasar itu, "Ulang: Satu Video"
  // mengulang video yang sama dari awal, "Ulang: Semua" lanjut ke video
  // berikut di ytQueue (berputar balik ke awal daftar di akhir).
  ytEl.addEventListener("load", () => {
    if (!ytEl.src || !ytEl.contentWindow) return;
    ytLastState = null;
    const sendListening = () => {
      if (!ytEl.contentWindow) return;
      try { ytEl.contentWindow.postMessage(JSON.stringify({ event: "listening", id: "ytView" }), "*"); } catch (e) {}
    };
    sendListening();
    // PERBAIKAN (4 Sep 2026, permintaan operator) -- laporan: "▶️ Play
    // pertama kali kadang tidak terasa, progress bar diam/tidak bisa
    // digeser, sampai ditekan ⏸️ Pause lalu ▶️ Play lagi baru jalan".
    // Sebabnya: handshake "listening" di atas dikirim TEPAT saat
    // event "load" iframe luar ini menyala -- itu cuma berarti
    // DOKUMEN HTML pembungkus pemutar YouTube sudah selesai dimuat,
    // BUKAN berarti skrip pemutar YouTube DI DALAMNYA sudah benar-benar
    // siap mendengarkan pesan. Kalau "listening" tiba SEBELUM pemutar
    // siap, pesan itu terbuang percuma -- akibatnya perintah "playVideo"
    // pertama & laporan posisi/durasi (infoDelivery, dipakai progress
    // bar #psYtLiveBar di Studio) telat/tidak pernah datang, sampai
    // interaksi ke-2 (Pause -> Play) "membangunkannya". Perbaikan:
    // ulangi kiriman "listening" beberapa kali di detik-detik pertama
    // (bukan cuma sekali) -- aman diulang (idempotent, pemutar cuma
    // mencatat pengirim mana yang mendengarkan), jadi salah satu
    // percobaan pasti sampai setelah pemutar sungguh siap.
    [250, 600, 1200, 2000].forEach((ms) => setTimeout(sendListening, ms));
  });

  // BARU (4 Sep 2026) -- SC.Widget resmi (SDK dimuat di <head>, lihat
  // <script src="https://w.soundcloud.com/player/api.js">) dipasang
  // SETELAH #scView selesai memuat src barunya -- supaya SDK mengikat
  // ke iframe yang isinya sudah benar (trek yang baru ditempel, bukan
  // trek sebelumnya). Kalau SDK belum sempat termuat (mis. koneksi
  // lambat saat Layar 2 baru dibuka), `window.SC` belum ada -- di sini
  // diperiksa dulu, TIDAK error, cuma kontrol Play/Pause dari Studio
  // belum akan merespons sampai giliran berikut src berganti lagi.
  scEl.addEventListener("load", () => {
    if (!scEl.src || typeof window.SC === "undefined" || !window.SC.Widget) { scWidget = null; return; }
    try {
      scWidget = SC.Widget(scEl);
      scWidget.bind(SC.Widget.Events.PLAY, () => reportScState(true));
      scWidget.bind(SC.Widget.Events.PAUSE, () => reportScState(false));
      scWidget.bind(SC.Widget.Events.FINISH, () => reportScState(false));
    } catch (e) { scWidget = null; }
  });
  // Lapor balik status main/jeda SoundCloud ke jendela utama (Studio) --
  // dipakai supaya tombol ▶️/⏸️ di tab "🔗 Link" bisa menunjukkan status
  // yang BENAR (mis. kalau operator mengeklik langsung tombol bawaan di
  // bilah SoundCloud sendiri, bukan lewat tombol Studio), sama semangat
  // seperti reportYtProgress() di atas untuk YouTube.
  function reportScState(isPlaying) {
    if (!window.opener) return;
    try {
      window.opener.postMessage({
        source: "bibleAppPresenter",
        payload: { type: "present_sc_state", isPlaying },
      }, location.origin);
    } catch (e) {}
  }

  function ytSendCommand(func, args) {
    if (!ytEl.contentWindow) return;
    try { ytEl.contentWindow.postMessage(JSON.stringify({ event: "command", func, args: args || [] }), "*"); } catch (e) {}
  }
  function appendAutoplay(embedUrl) {
    const sep = embedUrl.includes("?") ? "&" : "?";
    return embedUrl + sep + "autoplay=1";
  }
  // BARU (4 Sep 2026 v2, permintaan operator) -- laporkan balik posisi
  // (detik berjalan) & durasi video YouTube utama yang SUNGGUH sedang
  // tayang ke jendela utama (Studio Presentasi), supaya progress bar +
  // kolom waktu LIVE di sana (#psYtLiveBar, lihat wireYtControls() di
  // js/presentation-studio.js) ikut bergerak sesuai kenyataan -- baik
  // selagi main (beberapa kali per detik) maupun selagi dijeda (posisi
  // diam di detik terakhir). Ditahan (throttle) ke maksimal 5x/detik
  // supaya tidak membanjiri postMessage; YouTube sendiri bisa mengirim
  // "infoDelivery" jauh lebih sering dari itu.
  let ytLastProgressPostAt = 0;
  function reportYtProgress(info) {
    if (!window.opener || typeof info.currentTime !== "number") return;
    const now = Date.now();
    if (now - ytLastProgressPostAt < 200) return;
    ytLastProgressPostAt = now;
    try {
      window.opener.postMessage({
        source: "bibleAppPresenter",
        type: "present_yt_progress",
        currentTime: info.currentTime,
        duration: typeof info.duration === "number" ? info.duration : 0,
        state: typeof info.playerState === "number" ? info.playerState : null,
      }, location.origin);
    } catch (err) { /* beda origin / opener tertutup -- diamkan */ }
  }
  window.addEventListener("message", (e) => {
    if (e.source !== ytEl.contentWindow) return; // hanya pesan dari player YouTube utama
    let data;
    try { data = JSON.parse(e.data); } catch (err) { return; }
    if (!data || data.event !== "infoDelivery" || !data.info) return;
    reportYtProgress(data.info);
    if (typeof data.info.playerState !== "number") return;
    const state = data.info.playerState;
    if (state === ytLastState) return;
    const prevState = ytLastState;
    ytLastState = state;
    if (state === 0 && prevState !== null) { // 0 = berakhir (ended)
      if (ytRepeatMode === "one") {
        ytSendCommand("seekTo", [0, true]);
        ytSendCommand("playVideo");
      } else if (ytRepeatMode === "all" && ytQueue.length > 1) {
        ytQueueIndex = (ytQueueIndex + 1) % ytQueue.length;
        const next = ytQueue[ytQueueIndex];
        if (next && next.embedUrl) { ytEl.src = appendAutoplay(next.embedUrl); }
      } else if (ytRepeatMode === "all" && ytQueue.length === 1) {
        // Cuma 1 video di daftar -- "Ulang: Semua" berarti sama seperti
        // "Ulang: Satu" untuk kasus ini.
        ytSendCommand("seekTo", [0, true]);
        ytSendCommand("playVideo");
      }
    }
  });

  // Beri tahu jendela utama bahwa Layar 2 sudah siap menerima konten --
  // jendela utama akan mengirim ulang konten TERAKHIR begitu pesan ini
  // diterima (lihat js/presentation.js & js/presentation-studio.js).
  if (window.opener) {
    try {
      window.opener.postMessage({ source: "bibleAppPresenter", type: "present_ready" }, location.origin);
    } catch (e) { /* beda origin / opener tertutup -- diamkan */ }
  }

  // ------------------------------------------------------------
  // Laporkan bentuk (rasio) jendela Layar 2 yang SUNGGUH aktif ke
  // jendela utama -- dipakai untuk mengunci bentuk kotak pratinjau
  // (#psPreviewBoxWrap di Studio Presentasi / #presentPreviewBox di
  // panel ⋮ biasa) supaya SELALU sama persis dengan Layar 2 yang
  // sesungguhnya, apa pun ukurannya (termasuk kalau operator
  // menggeser-ubah ukuran jendelanya secara manual, atau proyektor
  // punya resolusi yang tidak standar). Ini menggantikan pendekatan
  // "pilih resolusi manual" sebelumnya -- sekarang otomatis mengikuti
  // kenyataan, jadi posisi Penunjuk/Pen & titik patah baris teks juga
  // ikut akurat tanpa operator perlu mengatur apa pun.
  // ------------------------------------------------------------
  function reportGeometry() {
    if (!window.opener) return;
    try {
      window.opener.postMessage({
        source: "bibleAppPresenter",
        type: "present_geometry",
        width: window.innerWidth,
        height: window.innerHeight,
      }, location.origin);
    } catch (e) { /* beda origin / opener tertutup -- diamkan */ }
  }
  reportGeometry();
  let geomResizeTimer = null;
  window.addEventListener("resize", () => {
    if (geomResizeTimer) clearTimeout(geomResizeTimer);
    geomResizeTimer = setTimeout(() => {
      reportGeometry();
      if (penStrokeHistory.length) redrawAllPenStrokes();
    }, 120);
  });
</script>
</body>
</html>
